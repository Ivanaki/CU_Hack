[project]
name = "honest-month"
version = "0.1.0"
description = "Честный месяц — учёт личных финансов с корректной классификацией переводов, долгов и общих счетов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "chardet>=5.2",
    "pdfplumber>=0.11.10,<0.12",
    # Нужен FastAPI для multipart-загрузок: через них приезжают скриншоты
    # и файлы выписок. Без него приложение не стартует вовсе.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "freezegun>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
