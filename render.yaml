services:
  - type: web
    name: cu-hack-honest-month
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: API_PORT=$PORT python -m app.main
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: none
