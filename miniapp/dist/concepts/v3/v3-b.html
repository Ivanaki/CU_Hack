<!DOCTYPE html>
<html lang="ru" data-variant="b" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Честный месяц — Питомец</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* ============================================================
   ВАРИАНТ B — «ПИТОМЕЦ». Маскот главный герой экрана: он большой,
   стоит в своей «комнате», кольцо осознанности — нимб вокруг него.
   Никакого XP-обвеса: тёплые мягкие карточки, крупные радиусы.
   ============================================================ */
:root{
  --bg:   #FDF6E9;
  --bg-2: #F6EAD3;
  --card: #FFFFFF;
  --card-2:#FBF3E3;
  --ink:  #22282E;
  --hint: #8E8879;
  --stroke:#1B2430; --chip:#FBF0D9;
  --gold:#F5B93A; --gold-soft:#FDF1D6;
  --green:#4CC86A; --green-d:#2E9E55; --green-soft:#E6F8EB;
  --coral:#FF7A59; --coral-d:#DF5638; --coral-soft:#FFEDE7;
  --sh-1:0 1px 2px rgba(60,45,20,.05);
  --sh-2:0 2px 6px rgba(60,45,20,.05), 0 14px 30px -16px rgba(60,45,20,.28);
  --sh-3:0 4px 10px rgba(60,45,20,.07), 0 26px 48px -22px rgba(60,45,20,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;font-weight:600;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(820px 500px at 50% -12%, rgba(76,200,106,.18), transparent 60%),
    radial-gradient(520px 480px at -10% 46%, rgba(245,185,58,.20), transparent 62%),
    radial-gradient(560px 480px at 112% 78%, rgba(255,122,89,.14), transparent 62%),
    linear-gradient(180deg, var(--bg), var(--bg-2))}
.phone{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;
  padding:0 16px 14px;overflow-x:hidden}

.bar{display:flex;align-items:center;gap:8px;padding:14px 2px 6px}
.bar .mo{font-size:19px;font-weight:900;letter-spacing:-.02em}
.bar .yr{font-size:12px;font-weight:700;color:var(--hint)}
.bar .sp{flex:1}
.bar .st{display:flex;align-items:center;gap:5px;background:var(--coral-soft);border-radius:999px;
  padding:5px 11px 5px 8px;font-size:12.5px;font-weight:900;color:var(--coral-d)}
.bar .st .icbox{width:17px;height:17px}
.tbtn{border:0;background:var(--card);border-radius:999px;width:34px;height:34px;font-size:15px;
  cursor:pointer;color:var(--hint);font-family:inherit;box-shadow:var(--sh-1);flex:0 0 34px;padding:0}

/* ================= СЦЕНА С МАСКОТОМ ================= */
.stage{position:relative;border-radius:30px;overflow:hidden;margin-bottom:14px;padding:12px 16px 16px;
  background:linear-gradient(178deg, var(--card) 0%, var(--card) 58%, var(--green-soft) 100%);
  box-shadow:var(--sh-3)}
.stage .floor{position:absolute;left:-10%;right:-10%;bottom:-70px;height:200px;border-radius:50%;
  background:radial-gradient(60% 60% at 50% 40%, rgba(76,200,106,.30), rgba(76,200,106,.10) 70%, transparent 72%)}
.stage .grid{position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(currentColor 1.2px, transparent 1.4px);background-size:20px 20px}
.stage>*{position:relative;z-index:1}
.stage-top{display:flex;align-items:flex-start;gap:8px;min-height:56px}
.bubble{background:var(--chip);color:#1B2430;border:3px solid var(--stroke);border-radius:16px 16px 16px 5px;
  padding:8px 11px;font-size:12px;font-weight:800;line-height:1.35;max-width:205px;
  transform-origin:0 100%;animation:bub-in .55s cubic-bezier(.3,1.5,.5,1) both}
.bubble b{color:var(--coral-d);white-space:nowrap}
@keyframes bub-in{0%{opacity:0;transform:scale(.72) translateY(8px)}100%{opacity:1;transform:none}}
.lvl{margin-left:auto;text-align:right;flex:0 0 auto}
.lvl .a{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--hint)}
.lvl .b{font-size:12.5px;font-weight:900;margin-top:2px;white-space:nowrap}

.pet{position:relative;width:256px;height:256px;margin:-10px auto -6px;max-width:100%}
.pet .halo{position:absolute;inset:0}
.pet .halo svg{display:block;width:100%;height:100%}
.pet .masbtn{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  width:218px;height:218px;background:none;border:0;padding:0;cursor:pointer}
.pet .pct{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);display:flex;align-items:baseline;
  gap:2px;background:var(--chip);border:3px solid var(--stroke);border-radius:999px;padding:3px 14px;
  box-shadow:0 3px 0 var(--stroke);color:#1B2430;z-index:2}
.pet .pct b{font-size:26px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pet .pct i{font-size:13px;font-style:normal;font-weight:900}
.stage .cap{text-align:center;font-size:11px;font-weight:800;color:var(--hint);margin-top:14px;
  letter-spacing:.06em;text-transform:uppercase}

/* ================= МЯГКАЯ СЕТКА ПОКАЗАТЕЛЕЙ ================= */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border-radius:20px;padding:12px 13px;box-shadow:var(--sh-2)}
.tile .k{font-size:10.5px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:19px;font-weight:900;margin-top:4px;letter-spacing:-.03em;white-space:nowrap}
.tile .s{font-size:11px;font-weight:700;color:var(--hint);margin-top:2px}
.tile .s.up{color:var(--coral-d)} .tile .s.down{color:var(--green-d)}
.tile.wide{grid-column:1 / -1}

.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-2)}
.h{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.h h2{margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.015em}
.h .sp{flex:1}
.h .tag{font-size:11px;font-weight:800;color:var(--hint)}

/* ================= ПРОГНОЗ ================= */
.fc .sum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fc .sum .big{font-size:27px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.fc .sum .lbl{font-size:11.5px;font-weight:700;color:var(--hint)}
.fcbar{position:relative;height:16px;border-radius:9px;background:var(--card-2);margin:14px 0 8px;overflow:hidden}
.fcbar i{position:absolute;inset:0;right:auto;width:0;border-radius:9px;background:var(--gold);
  transition:width 1.2s cubic-bezier(.22,1.3,.36,1)}
.fcbar u{position:absolute;top:0;bottom:0;width:3px;background:var(--coral);border-radius:2px;
  transition:left 1.2s cubic-bezier(.22,1.3,.36,1);left:0}
.fc .legend{display:flex;gap:14px;font-size:11px;font-weight:800;color:var(--hint)}
.fc .legend span{display:flex;align-items:center;gap:5px}
.fc .legend i{width:9px;height:9px;border-radius:3px;display:block}
.fc .two{display:flex;gap:10px;margin-top:13px}
.fc .two>div{flex:1;min-width:0;background:var(--card-2);border-radius:16px;padding:10px 11px}
.fc .two .k{font-size:10px;font-weight:800;color:var(--hint);text-transform:uppercase;letter-spacing:.05em}
.fc .two .v{font-size:15px;font-weight:900;margin-top:3px;white-space:nowrap}

/* ================= ДЕЛА ================= */
.todo{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--card-2)}
.todo:last-child{border-bottom:0;padding-bottom:0}
.todo:first-child{padding-top:0}
.todo .icbox{width:38px;height:38px;flex:0 0 38px;border-radius:13px;background:#fff;padding:4px;
  box-shadow:var(--sh-1)}
.todo .t{font-size:13.5px;font-weight:800}
.todo .s{font-size:11px;font-weight:700;color:var(--hint);margin-top:1px}
.todo .a{margin-left:auto;font-size:14.5px;font-weight:900;white-space:nowrap;color:var(--coral-d)}
.todo.done .a{color:var(--green-d)}

/* ================= СТРИК ================= */
.streak{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:24px;padding:14px 16px;
  margin-bottom:14px;box-shadow:var(--sh-2)}
.streak .fl{width:40px;height:44px;flex:0 0 40px}
.streak .fl .ic{animation:fl-breathe 1.7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fl-breathe{0%,100%{transform:scaleY(1) scaleX(1)}45%{transform:scaleY(1.08) scaleX(.95)}}
.streak .n{font-size:27px;font-weight:900;letter-spacing:-.04em;line-height:1}
.streak .t{font-size:11.5px;font-weight:700;color:var(--hint);margin-top:2px}
.streak .dots{margin-left:auto;display:flex;gap:5px}
.streak .dots i{width:13px;height:13px;border-radius:50%;background:var(--card-2);display:block}
.streak .dots i.on{background:var(--green)}
.streak .dots i.today{box-shadow:0 0 0 3px var(--green-soft)}
.streak.flash{animation:st-flash .85s ease-out}
@keyframes st-flash{0%{transform:scale(1)}30%{transform:scale(1.02)}100%{transform:scale(1)}}
.streak.flash .fl{animation:fl-pop .85s cubic-bezier(.3,1.5,.4,1)}
@keyframes fl-pop{0%{transform:scale(1)}32%{transform:scale(1.4) rotate(-7deg)}100%{transform:scale(1)}}

/* ================= ВОПРОС ================= */
.qwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.qwrap>.qin{overflow:hidden;min-height:0}
.qwrap.gone{grid-template-rows:0fr}
.quiz{background:var(--card);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-2);
  border:2px solid var(--green-soft);
  transition:transform .42s cubic-bezier(.5,-.2,.7,.4), opacity .34s ease}
.qwrap.gone .quiz{transform:translateX(118%) rotate(6deg) scale(.95);opacity:0;pointer-events:none}
.quiz.pop{animation:q-pop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes q-pop{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
.asker{display:flex;align-items:flex-start;gap:9px;margin-bottom:12px}
.asker .head{width:46px;height:46px;flex:0 0 46px}
.asker .head .coin{width:100%;height:100%;display:block}
.asker .say{background:var(--green-soft);border-radius:14px 14px 14px 4px;padding:8px 11px;
  font-size:14.5px;font-weight:800;line-height:1.35}
.who{display:flex;align-items:center;gap:10px;background:var(--card-2);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.who .av{width:38px;height:38px;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center;
  font-weight:900;font-size:15px;flex:0 0 38px;color:#1B2430;padding:4px;box-shadow:var(--sh-1)}
.who .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dt{font-size:11px;font-weight:700;color:var(--hint)}
.who .am{margin-left:auto;font-size:16px;font-weight:900;white-space:nowrap}
.who .am.in{color:var(--green-d)}
.qn{font-size:12px;font-weight:700;color:var(--hint);margin:-4px 0 12px;line-height:1.45}
.ans{width:100%;display:flex;align-items:center;gap:10px;background:var(--card-2);border:2px solid transparent;
  border-radius:18px;padding:13px 15px;margin-bottom:9px;font:inherit;font-size:14.5px;font-weight:800;
  color:var(--ink);cursor:pointer;text-align:left;transition:background .16s,border-color .16s,transform .1s}
.ans:last-child{margin-bottom:0}
.ans:hover{background:var(--green-soft);border-color:var(--green)}
.ans:active{transform:scale(.982)}
.ans.picked{background:var(--green-soft);border-color:var(--green);animation:ans-pick .4s cubic-bezier(.3,1.5,.4,1)}
@keyframes ans-pick{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.numrow{display:flex;gap:8px}
.numrow .ans{justify-content:center;font-size:19px;padding:14px 0;margin-bottom:0}
.numrow .ans.sugg{background:var(--green-soft);border-color:var(--green)}
.wide{margin-top:9px;justify-content:center;font-size:13.5px}
.alldone{text-align:center;padding:24px 16px;background:var(--green-soft);border-radius:26px;margin-bottom:14px;
  font-size:14px;font-weight:800;line-height:1.5;animation:q-pop .5s cubic-bezier(.3,1.4,.5,1) both}
.alldone .icbox{width:48px;height:48px;margin:0 auto 8px}

/* ================= КАТЕГОРИИ / СОВЕТЫ ================= */
.catrow{display:flex;align-items:center;gap:11px;padding:8px 0}
.catrow .icbox{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:#fff;padding:3px}
.catrow .n{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .tr{height:7px;border-radius:4px;background:var(--card-2);margin-top:6px;overflow:hidden}
.catrow .tr i{display:block;height:100%;border-radius:4px;width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.catrow .r{text-align:right;white-space:nowrap}
.catrow .v{font-size:13.5px;font-weight:900}
.catrow .d{font-size:10.5px;font-weight:700;margin-top:2px;color:var(--hint)}
.catrow .d.up{color:var(--coral-d)} .catrow .d.down{color:var(--green-d)}

.tipcard{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--card-2)}
.tipcard:last-child{border-bottom:0;padding-bottom:0}
.tipcard:first-child{padding-top:0}
.tipcard .icbox{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#fff;padding:4px;box-shadow:var(--sh-1)}
.tipcard .t{font-size:13.5px;font-weight:900}
.tipcard .d{font-size:12px;font-weight:600;color:var(--hint);margin-top:4px;line-height:1.45}
.tipcard .g{display:inline-block;margin-top:8px;background:var(--green-soft);color:var(--green-d);
  font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap}

.nav{position:sticky;bottom:10px;display:flex;gap:4px;background:var(--card);border-radius:22px;padding:7px;
  margin-top:10px;box-shadow:var(--sh-3)}
.nav button{flex:1;background:none;border:0;border-radius:16px;padding:7px 0;font:inherit;font-size:9.5px;
  font-weight:800;color:var(--hint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button .icbox{width:22px;height:22px;opacity:.55}
.nav button.on{background:var(--green-soft);color:var(--green-d)}
.nav button.on .icbox{opacity:1}

/* ===== БЛОК «ДОБАВИТЬ ОПЕРАЦИИ» ================================= */
.intake .ways{display:flex;flex-direction:column;gap:9px}
.way{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;color:var(--ink);
  cursor:pointer;background:var(--card-2);padding:11px 12px;position:relative;
  transition:background .16s, transform .08s, box-shadow .08s}
.way .icbox{width:40px;height:40px;flex:0 0 40px;background:#fff;padding:5px}
.way .tx{flex:1;min-width:0}
.way .tx b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.way .tx i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--hint);margin-top:2px;
  line-height:1.35}
.way .go{font-size:20px;font-weight:900;color:var(--hint);flex:0 0 auto;line-height:1}
.way.cash{align-items:flex-start;cursor:default}
.cashrow{display:flex;gap:7px;margin-top:9px}
.cashrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;font-weight:700;color:var(--ink);
  background:var(--card);padding:9px 11px;outline:none;-webkit-appearance:none}
.cashrow input::placeholder{color:var(--hint);font-weight:600}
.cashrow button{font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:9px 15px;
  background:var(--green);color:#0F2417;white-space:nowrap;border:0}
.cashhint{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--hint);margin-top:8px}
.cashhint .icbox{width:15px;height:15px;background:none;padding:0;flex:0 0 15px;border:0}

.istatus{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;font-size:12.5px;
  font-weight:700;line-height:1.4;animation:ist-in .32s cubic-bezier(.3,1.3,.5,1) both}
.istatus b{font-weight:900;white-space:nowrap}
@keyframes ist-in{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.istatus .icbox{width:26px;height:26px;flex:0 0 26px;background:none;padding:0;border:0}
.istatus.wait{background:var(--gold-soft)}
.istatus.ok{background:var(--green-soft)}
.istatus.err{background:var(--coral-soft)}
.retry{font:inherit;font-size:11.5px;font-weight:800;background:none;border:0;cursor:pointer;
  color:var(--coral-d);text-decoration:underline;padding:0;white-space:nowrap}
.spin{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:3px solid rgba(27,36,48,.16);
  border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iprog{height:7px;margin-top:9px;overflow:hidden;background:var(--card-2)}
.iprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .22s linear}

/* «наклеечный» вариант (A, D) */
.intake.sticker .way{border:2.5px solid var(--stroke);border-radius:15px;box-shadow:0 3px 0 var(--stroke)}
.intake.sticker .way:not(.cash):hover{background:var(--gold-soft)}
.intake.sticker .way:not(.cash):active{transform:translateY(3px);box-shadow:none}
.intake.sticker .way .icbox{border:2.5px solid var(--stroke);border-radius:12px}
.intake.sticker .cashrow input{border:2.5px solid var(--stroke);border-radius:12px}
.intake.sticker .cashrow button{border:2.5px solid var(--stroke);border-radius:12px;box-shadow:0 3px 0 var(--stroke)}
.intake.sticker .cashrow button:active{transform:translateY(3px);box-shadow:none}
.intake.sticker .istatus{border:2.5px solid var(--stroke);border-radius:14px}
.intake.sticker .iprog{border:2px solid var(--stroke);border-radius:6px}

/* мягкий вариант (B, C) */
.intake.soft .way{border:2px solid transparent;border-radius:18px}
.intake.soft .way:not(.cash):hover{background:var(--green-soft);border-color:var(--green)}
.intake.soft .way:not(.cash):active{transform:scale(.985)}
.intake.soft .way .icbox{border-radius:13px}
.intake.soft .cashrow input{border:2px solid var(--card-2);border-radius:14px}
.intake.soft .cashrow input:focus{border-color:var(--green)}
.intake.soft .cashrow button{border-radius:14px}
.intake.soft .istatus{border-radius:15px}
.intake.soft .iprog{border-radius:4px}

/* Готовые PNG-иконки нарисованы на белом фоне, поэтому плитка под ними
   тоже белая в обеих темах — тогда шва не видно. */
.ic{width:100%;height:100%;display:block;object-fit:contain}
.icbox{display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
/* PNG заливает плитку целиком — её белый фон становится фоном плитки,
   а форму (круг или скруглённый квадрат) задаёт сама плитка */
.icbox:has(img.ic){padding:0;background:#FFFFFF}
img.ic{object-fit:cover}

/* ===== ДВИЖОК МАСКОТА =================================================
   Состояния задаются классом на <svg>: s-proud s-curious s-hype s-sad
   s-think s-party. Каждый «слой» группы отвечает за свою трансформацию,
   чтобы анимации не перетирали друг друга.                             */
.mas{display:block;width:100%;height:100%}
.mas .v{display:none}
.mas .mo{fill:none;stroke:#1B2430;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}

.m-lean,.m-bounce,.m-breath,.m-squash{transform-box:view-box;transform-origin:100px 176px}
.m-breath{animation:m-breath 3.6s ease-in-out infinite}
@keyframes m-breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.018)}}
.m-lean{transition:transform .55s cubic-bezier(.34,1.5,.5,1)}
.s-curious .m-lean{transform:rotate(-7deg)}
.s-think   .m-lean{transform:rotate(5deg)}
.s-sad     .m-lean{transform:translateY(8px) scale(.955)}
.s-sad     .m-breath{animation-duration:5.4s}

/* ---------- состояние маскота ---------- */
const mstate = { forced:null, cur:null };
function setMascot(s){
  mstate.cur = s;
  document.querySelectorAll(".mas").forEach(m => m.setAttribute("class", "mas s-" + s));
}
/* после перерисовки разметки состояние надо вернуть на место */
function reapplyMascot(){ setMascot(mstate.cur || autoMascot()); }
function autoMascot(){
  if (mstate.forced) return mstate.forced;
  if (state.unclear > 0) return "curious";
  return "proud";
}
let tapT = null;
function tapMascot(){
  haptic("light");
  document.querySelectorAll(".mas").forEach(svg => {
    svg.classList.remove("tap"); void svg.getBoundingClientRect(); svg.classList.add("tap");
  });
  clearTimeout(tapT);
  tapT = setTimeout(() => document.querySelectorAll(".mas").forEach(s => s.classList.remove("tap")), 620);
  say(state.unclear > 0 ? TAP_LINES.work : TAP_LINES.done);
}
const TAP_LINES = {
  work: ["Щекотно! Но 4 700 ₽ сами себя не объяснят.",
         "Я не коплю — я запоминаю.",
         "Один тап — и вопросов меньше."],
  done: ["Месяц честный. Можно выдохнуть.",
         "99% — почти идеально.",
         "Спроси что угодно, я всё помню."]
};
function say(lines, forced){
  const b = document.getElementById("bubble");
  if (!b) return;
  b.innerHTML = forced || lines[Math.floor(Math.random() * lines.length)];
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}

/* витрина умеет переключать состояние маскота */
window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.type !== "mascot") return;
  mstate.forced = m.state === "auto" ? null : m.state;
  setMascot(autoMascot());
});

/* ===================== СОСТОЯНИЕ ===================== */
const state = { awareness:0, unclear:DATA.money.unclear, open:DATA.disputes.map(d => d.id), done:[] };
const app = document.getElementById("app");
const targetAwareness = () => Math.min(100, Math.round((1 - state.unclear / DATA.money.turnover) * 100));
const growBars = () => requestAnimationFrame(() =>
  document.querySelectorAll("[data-w]").forEach(i => { i.style.width = i.dataset.w; }));

function countTo(node, p, first, dur){
  if (!node) return;
  const from = first ? 0 : parseInt(node.textContent, 10) || 0;
  const t0 = performance.now(); dur = dur || (first ? 1200 : 700);
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    node.textContent = Math.round(from + (p - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

let busy = false;
function answer(d, wrap, btn){
  if (busy) return; busy = true;
  haptic("medium");
  btn.classList.add("picked");
  setMascot("party");
  if (typeof flashStreak === "function") flashStreak();
  setTimeout(() => {
    wrap.classList.add("gone");
    setTimeout(() => {
      state.open = state.open.filter(x => x !== d.id);
      if (d.clears) clearAmount(d.clears, "g-in");
      renderQueue();
      if (typeof renderTodos === "function") renderTodos();
      if (typeof renderQuests === "function") renderQuests();
      if (typeof renderPath === "function") renderPath();
      growBars();
      say(null, state.open.length
        ? "Записал! Остался ещё <b>" + state.open.length + " вопрос</b>."
        : "Красота — всё объяснили. Оборот понятен на <b>" + targetAwareness() + "%</b>.");
      busy = false;
      setTimeout(() => setMascot(autoMascot()), 1500);
    }, 460);
  }, 300);
}
function clearAmount(v, questId){
  state.unclear = Math.max(0, state.unclear - v);
  if (state.done.indexOf(questId) < 0) state.done.push(questId);
  document.querySelectorAll("[data-unclear]").forEach(n => { n.textContent = money(state.unclear); });
  document.querySelectorAll("[data-clear]").forEach(n => { n.textContent = money(DATA.money.turnover - state.unclear); });
  setAwareness(targetAwareness());
}

let intakeBusy = false, opsAdded = false;

function istatus(kind, html){
  const box = document.getElementById("istatus");
  if (!box) return;
  if (!kind){ box.innerHTML = ""; return; }
  const ic = kind === "wait" ? '<span class="spin"></span>'
           : kind === "ok"   ? '<span class="icbox">' + icon("check", true) + "</span>"
                             : '<span class="icbox">' + icon("warn", true) + "</span>";
  box.innerHTML = '<div class="istatus ' + kind + '">' + ic + "<span>" + html + "</span></div>"
    + (kind === "wait" ? '<div class="iprog"><i id="iprog"></i></div>' : "");
  const r = box.querySelector(".retry");
  if (r) r.onclick = () => { istatus(null); document.getElementById("csvFile").click(); };
}

function fakeUpload(label, onDone){
  intakeBusy = true;
  setMascot("think");
  istatus("wait", label);
  let p = 0;
  const bar = document.getElementById("iprog");
  const t = setInterval(() => {
    p = Math.min(100, p + 9 + Math.random() * 14);
    if (bar) bar.style.width = p + "%";
    if (p >= 100){ clearInterval(t); setTimeout(() => { intakeBusy = false; onDone(); }, 240); }
  }, 110);
}

function syncUnclear(){
  document.querySelectorAll("[data-unclear]").forEach(n => { n.textContent = money(state.unclear); });
  document.querySelectorAll("[data-clear]").forEach(n => { n.textContent = money(DATA.money.turnover - state.unclear); });
  setAwareness(targetAwareness());
  if (typeof renderTodos === "function") renderTodos();
  if (typeof renderQuests === "function") renderQuests();
  if (typeof renderPath === "function") renderPath();
  growBars();
}

function addNewOps(){
  if (opsAdded) return 0;
  opsAdded = true;
  NEW_OPS.forEach(o => { DATA.disputes.push(o); state.open.push(o.id); });
  state.unclear += 1500;                       /* новое непонятное поступление */
  renderQueue();
  syncUnclear();
  return NEW_OPS.length;
}

function bindIntake(){
  const csv = document.getElementById("csvFile");
  const shot = document.getElementById("shotFile");
  const cashBtn = document.getElementById("cashBtn");
  const cashText = document.getElementById("cashText");

  if (csv) csv.onchange = () => {
    const f = csv.files && csv.files[0];
    if (!f || intakeBusy) return;
    if (!/\.csv$/i.test(f.name)){
      haptic("heavy"); setMascot("sad");
      istatus("err", 'Это не похоже на выписку — нужен файл <b>.csv</b> из интернет-банка. ' +
                     '<button class="retry" type="button">Выбрать другой</button>');
      setTimeout(() => setMascot(autoMascot()), 2400);
      csv.value = ""; return;
    }
    fakeUpload("Читаю «" + f.name + "»…", () => {
      const n = addNewOps();
      haptic("medium"); setMascot(n ? "curious" : "party");
      istatus("ok", n
        ? "Выписка разобрана: <b>128 операций</b>. Новых вопросов: <b>" + n + "</b> — уже в очереди."
        : "Выписка разобрана: <b>128 операций</b>. Новых вопросов нет.");
      say(null, n ? "Нашёл <b>" + n + " непонятные операции</b>. Глянем?" : "Всё сошлось, вопросов нет.");
    });
    csv.value = "";
  };

  if (shot) shot.onchange = () => {
    const f = shot.files && shot.files[0];
    if (!f || intakeBusy) return;
    fakeUpload("Распознаю чек…", () => {
      haptic("medium"); setMascot("party");
      istatus("ok", "С чека считал: <b>Пятёрочка</b>, <b>1 284 ₽</b>, 19 сентября. Записал в «Продукты».");
      say(null, "Чек прочитал: <b>1 284 ₽</b> в продукты.");
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
    shot.value = "";
  };

  function submitCash(){
    if (intakeBusy) return;
    const v = (cashText.value || "").trim();
    if (!v){
      haptic("heavy");
      istatus("err", "Напишите, что и на сколько. Например: <b>кофе 300</b>.");
      cashText.focus(); return;
    }
    const m = v.match(/(\d[\d\s.,]*)\s*(?:р|₽|руб\w*)?\s*$/i);
    if (!m){
      haptic("heavy"); setMascot("think");
      istatus("err", "Не вижу суммы. Напишите так: <b>кофе 300</b>.");
      setTimeout(() => setMascot(autoMascot()), 2000);
      return;
    }
    const sum = Math.round(parseFloat(m[1].replace(/\s/g, "").replace(",", ".")));
    const what = v.slice(0, m.index).trim() || "наличные";
    fakeUpload("Записываю…", () => {
      state.unclear = Math.max(0, state.unclear - Math.min(sum, state.unclear));
      syncUnclear();
      haptic("medium"); setMascot("party");
      istatus("ok", "Записал: <b>" + what + "</b> — <b>" + money(sum) + "</b>. " +
                    "Непонятного осталось " + money(state.unclear) + ".");
      say(null, "Записал «" + what + "» на " + money(sum) + ".");
      cashText.value = "";
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
  }
  if (cashBtn) cashBtn.onclick = submitCash;
  if (cashText) cashText.onkeydown = e => { if (e.key === "Enter") submitCash(); };
}

      </label>
      <label class="way" data-way="shot">
        <input type="file" accept="image/*" capture="environment" id="shotFile" hidden>
        <span class="icbox">${icon("cam", true)}</span>
        <span class="tx"><b>Прислать скриншот или чек</b><i>Сфотографируйте чек или пришлите скрин из банка</i></span>
        <span class="go">&rsaquo;</span>
      </label>
      <div class="way cash">
        <span class="icbox">${icon("coins", true)}</span>
        <span class="tx"><b>Записать наличные</b>
          <span class="cashrow">
            <input type="text" id="cashText" inputmode="text" autocomplete="off"
                   placeholder="кофе 300" aria-label="Что и на сколько потратили">
            <button type="button" id="cashBtn">Записать</button>
          </span>
          <span class="cashhint"><span class="icbox">${icon("mic", true)}</span>
            То же самое можно надиктовать голосом в чат бота</span>
        </span>
      </div>
    </div>
    <div id="istatus"></div>
  </div>

  <div class="card fc">
    <div class="h"><h2>Успеем уложиться?</h2><span class="sp"></span>
      <span class="tag">день ${f.days_passed} из ${f.days_total}</span></div>
    <div class="sum"><span class="big">${fixed(f.projected.text)}</span><span class="lbl">к 30 сентября</span></div>
    <div class="fcbar"><i id="fcFill"></i><u id="fcMark"></u></div>
    <div class="legend">
      <span><i style="background:var(--gold)"></i>потрачено ${money(d.money.spent)}</span>
      <span><i style="background:var(--coral)"></i>прошло ${f.days_passed} из ${f.days_total} дней</span>
    </div>
    <div class="two">
      <div><div class="k">Осталось потратить</div><div class="v">${fixed(f.remaining.text)}</div></div>
      <div><div class="k">Это по</div><div class="v">${fixed(f.daily_rate.text)}<span style="font-size:11px;color:var(--hint)"> / день</span></div></div>
    </div>
  </div>

  <div id="queue"></div>

  <div class="card">
    <div class="h"><h2>Что Грош не понял</h2><span class="sp"></span>
      <span class="tag" data-unclear>${money(state.unclear)}</span></div>
    <div id="todos"></div>
  </div>

  <div class="streak" id="streakCard">
    <div class="fl icbox">${icon("flame", true)}</div>
    <div><div class="n">${d.streak.current} дней</div><div class="t">подряд · рекорд ${d.streak.record}</div></div>
    <div class="dots">${d.streak.week.map(w =>
      '<i class="' + (w.on ? "on" : "") + " " + (w.today ? "today" : "") + '"></i>').join("")}</div>
  </div>

  <div class="card">
    <div class="h"><h2>Куда ушли деньги</h2><span class="sp"></span><span class="tag">9 категорий</span></div>
    <div id="cats"></div>
  </div>

  <div class="card">
    <div class="h"><h2>Грош советует</h2><span class="sp"></span>
      <span class="tag">до −${money(d.tips.reduce((s, t) => s + t.gain, 0))}</span></div>
    <div id="tips"></div>
  </div>

  <div class="nav">
    <button class="on"><span class="icbox">${icon("nhome", true)}</span>Главная</button>
    <button><span class="icbox">${icon("nchart", true)}</span>Отчёты</button>
    <button><span class="icbox">${icon("nask", true)}</span>Вопросы</button>
    <button><span class="icbox">${icon("ncup", true)}</span>Награды</button>
  </div>`;

  renderTodos(); renderCats(); renderTips(); renderQueue(); bindIntake();
  document.getElementById("masTap").onclick = tapMascot;
  requestAnimationFrame(() => {
    setAwareness(targetAwareness(), true);
    document.getElementById("fcFill").style.width = spentPct + "%";
    document.getElementById("fcMark").style.left = Math.round(f.days_passed / f.days_total * 100) + "%";
    growBars(); setMascot(autoMascot());
  });
}

function renderTodos(){
  document.getElementById("todos").innerHTML = DATA.awareness.gaps.map(g => {
    const done = state.done.indexOf(g.id) >= 0;
    return `<div class="todo ${done ? "done" : ""}">
      <div class="icbox">${icon(done ? "check" : g.icon, done ? true : !!g.svg)}</div>
      <div style="min-width:0"><div class="t">${g.title}</div>
        <div class="s">${done ? "разобрано" : "ждёт одного тапа"}</div></div>
      <div class="a">${done ? "0 ₽" : money(g.amount)}</div></div>`; }).join("");
}
function renderCats(){
  const maxCat = DATA.categories[0].a;
  document.getElementById("cats").innerHTML = DATA.categories.map(c => `
    <div class="catrow">
      <div class="icbox">${icon(c.ic, !!c.svg)}</div>
      <div style="flex:1;min-width:0"><div class="n">${c.n}</div>
        <div class="tr"><i data-w="${Math.max(6, Math.round(c.a / maxCat * 100))}%" style="background:${c.c}"></i></div></div>
      <div class="r"><div class="v">${money(c.a)}</div>
        <div class="d ${c.d > 0 ? "up" : c.d < 0 ? "down" : ""}">${c.d === 0 ? "как в августе" : signed(c.d)}</div></div>
    </div>`).join("");
}
function renderTips(){
  document.getElementById("tips").innerHTML = DATA.tips.map(t => `
    <div class="tipcard"><div class="icbox">${icon(t.ic, !!t.svg)}</div>
      <div><div class="t">${t.t}</div><div class="d">${t.d}</div>
      <span class="g">экономия ${money(t.gain)}</span></div></div>`).join("");
}
function renderQueue(){
  const q = document.getElementById("queue"); q.innerHTML = "";
  const list = DATA.disputes.filter(d => state.open.indexOf(d.id) >= 0);
  if (!list.length){
    q.appendChild(el(`<div class="alldone"><div class="icbox">${icon("check", true)}</div>
      Грош разобрался со всем.<br>Оборот понятен на ${targetAwareness()}%.</div>`));
    return;
  }
  list.forEach(d => {
    const opts = d.numeric
      ? '<div class="numrow">' + d.options.map((o, i) =>
          '<button class="ans ' + (o.sugg ? "sugg" : "") + '" data-i="' + i + '">' + o.t + "</button>").join("") + "</div>" +
        '<button class="ans wide" data-i="more">' + d.more + "</button>"
      : d.options.map((o, i) => '<button class="ans" data-i="' + i + '">' + o.t + "</button>").join("");
    const av = d.avKind === "icon" ? icon(d.av, false) : d.av;
    const wrap = el(`
      <div class="qwrap" data-id="${d.id}"><div class="qin"><div class="quiz pop">
        <div class="asker"><div class="head">${COIN}</div><div class="say">${d.q}</div></div>
        <div class="who"><div class="av">${av}</div>
          <div style="min-width:0"><div class="nm">${d.who}</div><div class="dt">${d.date}</div></div>
          <div class="am ${d.dir === "in" ? "in" : ""}">${d.dir === "in" ? "+" : "−"}${money(d.amount)}</div></div>
        <div class="qn">${d.note}</div>${opts}
      </div></div></div>`);
    wrap.querySelectorAll(".ans").forEach(b => { b.onclick = () => answer(d, wrap, b); });
    q.appendChild(wrap);
  });
}
function flashStreak(){
  const n = document.getElementById("streakCard");
  if (!n) return; n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
}

render();
try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
</script>
</body>
</html>
