<!DOCTYPE html>
<html lang="ru" data-variant="c" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Честный месяц — Сводка</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   ВАРИАНТ C — «СВОДКА». Минимум игрушечности: крупная типографика,
   тонкие линейки, табличные цифры, один акцент. Грош маленький и
   появляется только там, где он что-то говорит.
   ============================================================ */
:root{
  --bg:   #FCFAF5;
  --bg-2: #F5F1E7;
  --card: #FFFFFF;
  --card-2:#F5F2EA;
  --ink:  #1B2430;
  --ink-2:#4A5560;
  --hint: #8E9399;
  --rule: #E6E2D8;
  --stroke:#1B2430; --chip:#FBF0D9;
  --gold:#F5B93A; --green:#4CC86A; --green-d:#2E9E55; --green-soft:#EAF7EE;
  --coral:#FF7A59; --coral-d:#D9502F; --coral-soft:#FDEDE8;
  --sh:0 1px 2px rgba(27,36,48,.04), 0 10px 28px -18px rgba(27,36,48,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;font-weight:450;line-height:1.45;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 420px at 50% -14%, rgba(245,185,58,.13), transparent 62%),
    radial-gradient(620px 520px at 116% 62%, rgba(76,200,106,.10), transparent 62%),
    linear-gradient(180deg, var(--bg), var(--bg-2))}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;
  background-image:repeating-linear-gradient(0deg, var(--ink) 0 1px, transparent 1px 6px)}
.phone{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;
  padding:0 16px 16px;overflow-x:hidden}

.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- шапка ---------- */
.bar{display:flex;align-items:baseline;gap:9px;padding:18px 0 4px;border-bottom:1px solid var(--rule)}
.bar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em}
.bar .yr{font-size:12px;font-weight:500;color:var(--hint)}
.bar .sp{flex:1}
.tbtn{border:1px solid var(--rule);background:transparent;border-radius:9px;width:30px;height:30px;
  font-size:13px;cursor:pointer;color:var(--hint);font-family:inherit;flex:0 0 30px;padding:0;align-self:center}

/* ---------- заголовок осознанности ---------- */
.head{display:flex;align-items:center;gap:8px;padding:20px 0 16px;border-bottom:1px solid var(--rule)}
.head .num{display:flex;align-items:flex-start;gap:2px;line-height:.86}
.head .num b{font-size:74px;font-weight:700;letter-spacing:-.055em}
.head .num i{font-size:26px;font-style:normal;font-weight:600;color:var(--hint);margin-top:6px}
.head .sub{font-size:12.5px;color:var(--hint);margin-top:9px;max-width:130px;line-height:1.35}
.head .sub b{color:var(--ink);font-weight:600}
.head .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gauge{width:96px;height:52px;position:relative}
.gauge svg{display:block}
.gauge .lab{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--hint);font-weight:600}
.masmini{width:76px;height:76px;background:none;border:0;padding:0;cursor:pointer;margin:-8px 0 -12px 0}
.speak{display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule)}
.speak .head-c{width:34px;height:34px;flex:0 0 34px}
.masmini .mas{overflow:visible}
.speak .head-c .coin{width:100%;height:100%;display:block}
.bubble{font-size:13px;color:var(--ink-2);line-height:1.45;padding-top:3px;
  animation:fade .45s ease both}
.bubble b{color:var(--coral-d);font-weight:650;white-space:nowrap}
@keyframes fade{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}

/* ---------- секции ---------- */
.sec{padding:18px 0;border-bottom:1px solid var(--rule)}
.sec:last-of-type{border-bottom:0}
.sec>.t{font-size:10.5px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--hint);
  margin-bottom:13px;display:flex;align-items:center;gap:8px}
.sec>.t .sp{flex:1}
.sec>.t em{font-style:normal;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:500}

.kpi{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.kpi .dl{font-size:12px;font-weight:600;color:var(--coral-d);background:var(--coral-soft);
  border-radius:6px;padding:2px 7px;white-space:nowrap}
.kpi .ex{margin-left:auto;font-size:12px;color:var(--hint);white-space:nowrap}

.rows{margin-top:14px}
.rw{display:flex;align-items:baseline;gap:10px;padding:7px 0;font-size:13px}
.rw .k{color:var(--hint)}
.rw .sp{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.rw .v{font-weight:600;white-space:nowrap}

/* прогноз */
.fc-bar{position:relative;height:6px;border-radius:3px;background:var(--card-2);margin:16px 0 9px}
.fc-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--ink);
  transition:width 1.2s cubic-bezier(.22,1.3,.36,1)}
.fc-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--coral);left:0;
  transition:left 1.2s cubic-bezier(.22,1.3,.36,1)}
.fc-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--hint)}
.fc-grid{display:flex;gap:0;margin-top:16px;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.fc-grid>div{flex:1;min-width:0;padding:11px 12px;border-right:1px solid var(--rule)}
.fc-grid>div:last-child{border-right:0}
.fc-grid .k{font-size:10.5px;color:var(--hint)}
.fc-grid .v{font-size:15px;font-weight:650;margin-top:3px;white-space:nowrap;letter-spacing:-.02em}

/* ---------- вопрос ---------- */
.qwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.qwrap>.qin{overflow:hidden;min-height:0}
.qwrap.gone{grid-template-rows:0fr}
.quiz{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:15px;margin-bottom:12px;
  box-shadow:var(--sh);transition:transform .42s cubic-bezier(.5,-.2,.7,.4), opacity .34s ease}
.qwrap.gone .quiz{transform:translateX(116%) rotate(4deg);opacity:0;pointer-events:none}
.quiz.pop{animation:q-pop .45s cubic-bezier(.3,1.3,.5,1) both}
@keyframes q-pop{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .av{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;
  font-weight:650;font-size:14px;flex:0 0 34px;padding:0;color:#1B2430;overflow:hidden}
.qtop .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .dt{font-size:11px;color:var(--hint)}
.qtop .am{margin-left:auto;font-size:15px;font-weight:650;white-space:nowrap}
.qtop .am.in{color:var(--green-d)}
.qask{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.qask .head-c{width:38px;height:38px;flex:0 0 38px}
.qask .head-c .coin{width:100%;height:100%;display:block}
.qask .q{font-size:15.5px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.qn{font-size:12px;color:var(--hint);margin:0 0 13px 48px;line-height:1.45}
.ansgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{background:var(--card-2);border:1px solid transparent;border-radius:11px;padding:11px 12px;
  font:inherit;font-size:13.5px;font-weight:550;color:var(--ink);cursor:pointer;text-align:left;
  transition:background .15s,border-color .15s,transform .1s}
.ans:hover{background:var(--green-soft);border-color:var(--green)}
.ans:active{transform:scale(.98)}
.ans.picked{background:var(--green-soft);border-color:var(--green)}
.numrow{display:flex;gap:7px}
.numrow .ans{flex:1;text-align:center;font-size:16px;font-weight:650}
.numrow .ans.sugg{border-color:var(--green);background:var(--green-soft)}
.wide{margin-top:8px;width:100%;text-align:center}
.alldone{border:1px dashed var(--green);background:var(--green-soft);border-radius:16px;padding:18px;
  text-align:center;font-size:13.5px;font-weight:550;margin-bottom:12px;animation:q-pop .45s ease both}
.alldone .icbox{width:34px;height:34px;margin:0 auto 8px}

/* ---------- таблица категорий ---------- */
.cat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.cat:last-child{border-bottom:0}
.cat .icbox{width:26px;height:26px;flex:0 0 26px;background:#fff;border-radius:7px}
.cat .n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cat .pc{font-size:11px;color:var(--hint);width:30px;text-align:right;flex:0 0 30px}
.cat .spk{width:56px;height:5px;border-radius:3px;background:var(--card-2);flex:0 0 56px;overflow:hidden}
.cat .spk i{display:block;height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.cat .v{font-size:13px;font-weight:650;width:76px;text-align:right;flex:0 0 76px;white-space:nowrap}

/* ---------- прочее ---------- */
.gap{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
.gap:last-child{border-bottom:0}
.gap .icbox{width:26px;height:26px;flex:0 0 26px;background:#fff;border-radius:7px}
.gap .sp{flex:1}
.gap .v{font-weight:650;color:var(--coral-d);white-space:nowrap}
.gap.done .v{color:var(--green-d)}

.tip{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule)}
.tip:last-child{border-bottom:0}
.tip .icbox{width:30px;height:30px;flex:0 0 30px;margin-top:1px;background:#fff;border-radius:8px}
.tip .t{font-size:13.5px;font-weight:600}
.tip .d{font-size:12px;color:var(--hint);margin-top:3px;line-height:1.45}
.tip .g{font-size:11.5px;font-weight:650;color:var(--green-d);margin-top:6px;display:inline-block}

.strk{display:flex;align-items:center;gap:9px;font-size:13px}
.strk .fl{width:22px;height:24px;flex:0 0 22px}
.strk .fl .ic{animation:fl-breathe 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fl-breathe{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.08)}}
.strk b{font-weight:650}
.strk .days{margin-left:auto;display:flex;gap:4px}
.strk .days i{width:8px;height:8px;border-radius:2px;background:var(--card-2);display:block}
.strk .days i.on{background:var(--green)}
.strk.flash .fl{animation:fl-pop .8s cubic-bezier(.3,1.5,.4,1)}
@keyframes fl-pop{0%{transform:scale(1)}32%{transform:scale(1.4)}100%{transform:scale(1)}}

/* блок добавления операций — в редакционной манере варианта C */
.sec.intake .way{background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:13px 0}
.sec.intake .way:last-child{border-bottom:0;padding-bottom:0}
.sec.intake .way:first-child{padding-top:0}
.sec.intake .way:not(.cash):hover{background:transparent}
.sec.intake .way .icbox{width:32px;height:32px;flex:0 0 32px;border-radius:9px}
.sec.intake .way .tx b{font-size:14px;font-weight:600}
.sec.intake .way .tx i{font-size:11.5px;font-weight:450}
.sec.intake .way .go{font-size:16px;font-weight:500}
.sec.intake .cashrow input{background:var(--card);border:1px solid var(--rule);border-radius:10px;font-weight:500}
.sec.intake .cashrow button{background:var(--ink);color:var(--card);border-radius:10px;font-weight:600}
.sec.intake .istatus{border-radius:12px;font-weight:500}
.sec.intake .iprog{border-radius:3px;height:5px}
.nav{position:sticky;bottom:12px;display:flex;background:var(--card);border:1px solid var(--rule);
  border-radius:14px;padding:4px;margin-top:16px;box-shadow:var(--sh)}
.nav button{flex:1;background:none;border:0;border-radius:10px;padding:8px 0;font:inherit;font-size:11px;
  font-weight:550;color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button .icbox{width:17px;height:17px;opacity:.55}
.nav button.on{background:var(--card-2);color:var(--ink)}
.nav button.on .icbox{opacity:1}
.nav button span.lb{display:none}
.nav button.on span.lb{display:inline}

/* ===== БЛОК «ДОБАВИТЬ ОПЕРАЦИИ» ================================= */
.intake .ways{display:flex;flex-direction:column;gap:9px}
.way{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;color:var(--ink);
  cursor:pointer;background:var(--card-2);padding:11px 12px;position:relative;
  transition:background .16s, transform .08s, box-shadow .08s}
.way .icbox{width:40px;height:40px;flex:0 0 40px;background:#fff;padding:5px}
.way .tx{flex:1;min-width:0}
.way .tx b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.way .tx i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--hint);margin-top:2px;
  line-height:1.35}
.way .go{font-size:20px;font-weight:900;color:var(--hint);flex:0 0 auto;line-height:1}
.way.cash{align-items:flex-start;cursor:default}
.cashrow{display:flex;gap:7px;margin-top:9px}
.cashrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;font-weight:700;color:var(--ink);
  background:var(--card);padding:9px 11px;outline:none;-webkit-appearance:none}
.cashrow input::placeholder{color:var(--hint);font-weight:600}
.cashrow button{font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:9px 15px;
  background:var(--green);color:#0F2417;white-space:nowrap;border:0}
.cashhint{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--hint);margin-top:8px}
.cashhint .icbox{width:15px;height:15px;background:none;padding:0;flex:0 0 15px;border:0}

.istatus{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;font-size:12.5px;
  font-weight:700;line-height:1.4;animation:ist-in .32s cubic-bezier(.3,1.3,.5,1) both}
.istatus b{font-weight:900;white-space:nowrap}
@keyframes ist-in{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.istatus .icbox{width:26px;height:26px;flex:0 0 26px;background:none;padding:0;border:0}
.istatus.wait{background:var(--gold-soft)}
.istatus.ok{background:var(--green-soft)}
.istatus.err{background:var(--coral-soft)}
.retry{font:inherit;font-size:11.5px;font-weight:800;background:none;border:0;cursor:pointer;
  color:var(--coral-d);text-decoration:underline;padding:0;white-space:nowrap}
.spin{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:3px solid rgba(27,36,48,.16);
  border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iprog{height:7px;margin-top:9px;overflow:hidden;background:var(--card-2)}
.iprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .22s linear}

/* «наклеечный» вариант (A, D) */
.intake.sticker .way{border:2.5px solid var(--stroke);border-radius:15px;box-shadow:0 3px 0 var(--stroke)}
.intake.sticker .way:not(.cash):hover{background:var(--gold-soft)}
.intake.sticker .way:not(.cash):active{transform:translateY(3px);box-shadow:none}
.intake.sticker .way .icbox{border:2.5px solid var(--stroke);border-radius:12px}
.intake.sticker .cashrow input{border:2.5px solid var(--stroke);border-radius:12px}
.intake.sticker .cashrow button{border:2.5px solid var(--stroke);border-radius:12px;box-shadow:0 3px 0 var(--stroke)}
.intake.sticker .cashrow button:active{transform:translateY(3px);box-shadow:none}
.intake.sticker .istatus{border:2.5px solid var(--stroke);border-radius:14px}
.intake.sticker .iprog{border:2px solid var(--stroke);border-radius:6px}

/* мягкий вариант (B, C) */
.intake.soft .way{border:2px solid transparent;border-radius:18px}
.intake.soft .way:not(.cash):hover{background:var(--green-soft);border-color:var(--green)}
.intake.soft .way:not(.cash):active{transform:scale(.985)}
.intake.soft .way .icbox{border-radius:13px}
.intake.soft .cashrow input{border:2px solid var(--card-2);border-radius:14px}
.intake.soft .cashrow input:focus{border-color:var(--green)}
.intake.soft .cashrow button{border-radius:14px}
.intake.soft .istatus{border-radius:15px}
.intake.soft .iprog{border-radius:4px}

/* Готовые PNG-иконки нарисованы на белом фоне, поэтому плитка под ними
   тоже белая в обеих темах — тогда шва не видно. */
.ic{width:100%;height:100%;display:block;object-fit:contain}
.icbox{display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
/* PNG заливает плитку целиком — её белый фон становится фоном плитки,
   а форму (круг или скруглённый квадрат) задаёт сама плитка */
.icbox:has(img.ic){padding:0;background:#FFFFFF}
img.ic{object-fit:cover}

/* ===== ДВИЖОК МАСКОТА =================================================
   Состояния задаются классом на <svg>: s-proud s-curious s-hype s-sad
   s-think s-party. Каждый «слой» группы отвечает за свою трансформацию,
   чтобы анимации не перетирали друг друга.                             */
.mas{display:block;width:100%;height:100%}
.mas .v{display:none}
.mas .mo{fill:none;stroke:#1B2430;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}

.m-lean,.m-bounce,.m-breath,.m-squash{transform-box:view-box;transform-origin:100px 176px}
.m-breath{animation:m-breath 3.6s ease-in-out infinite}
@keyframes m-breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.018)}}
.m-lean{transition:transform .55s cubic-bezier(.34,1.5,.5,1)}
.s-curious .m-lean{transform:rotate(-7deg)}
.s-think   .m-lean{transform:rotate(5deg)}
.s-sad     .m-lean{transform:translateY(8px) scale(.955)}
.s-sad     .m-breath{animation-duration:5.4s}
.s-hype  .m-bounce{animation:m-hop .58s cubic-bezier(.35,.9,.35,1) infinite}
.s-party .m-bounce{animation:m-jump .78s cubic-bezier(.25,1.1,.4,1) infinite}
.s-proud .m-bounce{animation:m-sway 4.6s ease-in-out infinite}
@keyframes m-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes m-jump{0%,100%{transform:translateY(0) rotate(0)}28%{transform:translateY(-18px) rotate(-6deg)}
  58%{transform:translateY(-3px) rotate(5deg)}80%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes m-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}

/* реакция на тап */
.m-squash{transform-origin:100px 178px}
.mas.tap .m-squash{animation:m-tap .55s cubic-bezier(.3,1.4,.4,1)}
@keyframes m-tap{0%{transform:scale(1,1)}20%{transform:scale(1.16,.84)}46%{transform:scale(.92,1.09)}
  70%{transform:scale(1.05,.96)}100%{transform:scale(1,1)}}
.tapring{transform-box:fill-box;transform-origin:center;opacity:0}
.mas.tap .tapring{animation:m-ring .6s ease-out}
@keyframes m-ring{0%{opacity:.7;transform:scale(.55)}100%{opacity:0;transform:scale(1.45)}}

/* моргание */
.eye{transform-box:fill-box;transform-origin:center;animation:m-blink 5.6s infinite}
@keyframes m-blink{0%,92.5%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}95.6%{transform:scaleY(1)}
  97%{transform:scaleY(.06)}98.4%{transform:scaleY(1)}}
.pupils{transform-box:view-box;transition:transform .45s cubic-bezier(.34,1.4,.5,1)}
.s-curious .pupils{transform:translate(4px,-2px)}

/* ---------- состояние маскота ---------- */
const mstate = { forced:null, cur:null };
function setMascot(s){
  mstate.cur = s;
  document.querySelectorAll(".mas").forEach(m => m.setAttribute("class", "mas s-" + s));
}
/* после перерисовки разметки состояние надо вернуть на место */
function reapplyMascot(){ setMascot(mstate.cur || autoMascot()); }
function autoMascot(){
  if (mstate.forced) return mstate.forced;
  if (state.unclear > 0) return "curious";
  return "proud";
}
let tapT = null;
function tapMascot(){
  haptic("light");
  document.querySelectorAll(".mas").forEach(svg => {
    svg.classList.remove("tap"); void svg.getBoundingClientRect(); svg.classList.add("tap");
  });
  clearTimeout(tapT);
  tapT = setTimeout(() => document.querySelectorAll(".mas").forEach(s => s.classList.remove("tap")), 620);
  say(state.unclear > 0 ? TAP_LINES.work : TAP_LINES.done);
}
const TAP_LINES = {
  work: ["Щекотно! Но 4 700 ₽ сами себя не объяснят.",
         "Я не коплю — я запоминаю.",
         "Один тап — и вопросов меньше."],
  done: ["Месяц честный. Можно выдохнуть.",
         "99% — почти идеально.",
         "Спроси что угодно, я всё помню."]
};
function say(lines, forced){
  const b = document.getElementById("bubble");
  if (!b) return;
  b.innerHTML = forced || lines[Math.floor(Math.random() * lines.length)];
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}

/* витрина умеет переключать состояние маскота */
window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.type !== "mascot") return;
  mstate.forced = m.state === "auto" ? null : m.state;
  setMascot(autoMascot());
});

/* ===================== СОСТОЯНИЕ ===================== */
const state = { awareness:0, unclear:DATA.money.unclear, open:DATA.disputes.map(d => d.id), done:[] };
const app = document.getElementById("app");
const targetAwareness = () => Math.min(100, Math.round((1 - state.unclear / DATA.money.turnover) * 100));
const growBars = () => requestAnimationFrame(() =>
  document.querySelectorAll("[data-w]").forEach(i => { i.style.width = i.dataset.w; }));

function countTo(node, p, first, dur){
  if (!node) return;
  const from = first ? 0 : parseInt(node.textContent, 10) || 0;
  const t0 = performance.now(); dur = dur || (first ? 1200 : 700);
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    node.textContent = Math.round(from + (p - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ===================== ОТВЕТ НА ВОПРОС ===================== */
let busy = false;
function answer(d, wrap, btn){
  if (busy) return; busy = true;
  haptic("medium");
  btn.classList.add("picked");
  setMascot("party");
  if (typeof flashStreak === "function") flashStreak();
  setTimeout(() => {
    wrap.classList.add("gone");
    setTimeout(() => {
      state.open = state.open.filter(x => x !== d.id);
      if (d.clears) clearAmount(d.clears, "g-in");
      renderQueue();
      if (typeof renderTodos === "function") renderTodos();
      if (typeof renderQuests === "function") renderQuests();
      if (typeof renderPath === "function") renderPath();
      growBars();
      say(null, state.open.length
        ? "Записал! Остался ещё <b>" + state.open.length + " вопрос</b>."
        : "Красота — всё объяснили. Оборот понятен на <b>" + targetAwareness() + "%</b>.");
      busy = false;
      setTimeout(() => setMascot(autoMascot()), 1500);
    }, 460);
  }, 300);
}
function clearAmount(v, questId){
  state.unclear = Math.max(0, state.unclear - v);
  if (state.done.indexOf(questId) < 0) state.done.push(questId);
  document.querySelectorAll("[data-unclear]").forEach(n => { n.textContent = money(state.unclear); });
  document.querySelectorAll("[data-clear]").forEach(n => { n.textContent = money(DATA.money.turnover - state.unclear); });
  setAwareness(targetAwareness());
}

let intakeBusy = false, opsAdded = false;

function istatus(kind, html){
  const box = document.getElementById("istatus");
  if (!box) return;
  if (!kind){ box.innerHTML = ""; return; }
  const ic = kind === "wait" ? '<span class="spin"></span>'
           : kind === "ok"   ? '<span class="icbox">' + icon("check", true) + "</span>"
                             : '<span class="icbox">' + icon("warn", true) + "</span>";
  box.innerHTML = '<div class="istatus ' + kind + '">' + ic + "<span>" + html + "</span></div>"
    + (kind === "wait" ? '<div class="iprog"><i id="iprog"></i></div>' : "");
  const r = box.querySelector(".retry");
  if (r) r.onclick = () => { istatus(null); document.getElementById("csvFile").click(); };
}

function fakeUpload(label, onDone){
  intakeBusy = true;
  setMascot("think");
  istatus("wait", label);
  let p = 0;
  const bar = document.getElementById("iprog");
  const t = setInterval(() => {
    p = Math.min(100, p + 9 + Math.random() * 14);
    if (bar) bar.style.width = p + "%";
    if (p >= 100){ clearInterval(t); setTimeout(() => { intakeBusy = false; onDone(); }, 240); }
  }, 110);
}

function syncUnclear(){
  document.querySelectorAll("[data-unclear]").forEach(n => { n.textContent = money(state.unclear); });
  document.querySelectorAll("[data-clear]").forEach(n => { n.textContent = money(DATA.money.turnover - state.unclear); });
  setAwareness(targetAwareness());
  if (typeof renderTodos === "function") renderTodos();
  if (typeof renderQuests === "function") renderQuests();
  if (typeof renderPath === "function") renderPath();
  growBars();
}

function addNewOps(){
  if (opsAdded) return 0;
  opsAdded = true;
  NEW_OPS.forEach(o => { DATA.disputes.push(o); state.open.push(o.id); });
  state.unclear += 1500;                       /* новое непонятное поступление */
  renderQueue();
  syncUnclear();
  return NEW_OPS.length;
}

function bindIntake(){
  const csv = document.getElementById("csvFile");
  const shot = document.getElementById("shotFile");
  const cashBtn = document.getElementById("cashBtn");
  const cashText = document.getElementById("cashText");

  if (csv) csv.onchange = () => {
    const f = csv.files && csv.files[0];
    if (!f || intakeBusy) return;
    if (!/\.csv$/i.test(f.name)){
      haptic("heavy"); setMascot("sad");
      istatus("err", 'Это не похоже на выписку — нужен файл <b>.csv</b> из интернет-банка. ' +
                     '<button class="retry" type="button">Выбрать другой</button>');
      setTimeout(() => setMascot(autoMascot()), 2400);
      csv.value = ""; return;
    }
    fakeUpload("Читаю «" + f.name + "»…", () => {
      const n = addNewOps();
      haptic("medium"); setMascot(n ? "curious" : "party");
      istatus("ok", n
        ? "Выписка разобрана: <b>128 операций</b>. Новых вопросов: <b>" + n + "</b> — уже в очереди."
        : "Выписка разобрана: <b>128 операций</b>. Новых вопросов нет.");
      say(null, n ? "Нашёл <b>" + n + " непонятные операции</b>. Глянем?" : "Всё сошлось, вопросов нет.");
    });
    csv.value = "";
  };

  if (shot) shot.onchange = () => {
    const f = shot.files && shot.files[0];
    if (!f || intakeBusy) return;
    fakeUpload("Распознаю чек…", () => {
      haptic("medium"); setMascot("party");
      istatus("ok", "С чека считал: <b>Пятёрочка</b>, <b>1 284 ₽</b>, 19 сентября. Записал в «Продукты».");
      say(null, "Чек прочитал: <b>1 284 ₽</b> в продукты.");
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
    shot.value = "";
  };

  function submitCash(){
    if (intakeBusy) return;
    const v = (cashText.value || "").trim();
    if (!v){
      haptic("heavy");
      istatus("err", "Напишите, что и на сколько. Например: <b>кофе 300</b>.");
      cashText.focus(); return;
    }
    const m = v.match(/(\d[\d\s.,]*)\s*(?:р|₽|руб\w*)?\s*$/i);
    if (!m){
      haptic("heavy"); setMascot("think");
      istatus("err", "Не вижу суммы. Напишите так: <b>кофе 300</b>.");
      setTimeout(() => setMascot(autoMascot()), 2000);
      return;
    }
    const sum = Math.round(parseFloat(m[1].replace(/\s/g, "").replace(",", ".")));
    const what = v.slice(0, m.index).trim() || "наличные";
    fakeUpload("Записываю…", () => {
      state.unclear = Math.max(0, state.unclear - Math.min(sum, state.unclear));
      syncUnclear();
      haptic("medium"); setMascot("party");
      istatus("ok", "Записал: <b>" + what + "</b> — <b>" + money(sum) + "</b>. " +
                    "Непонятного осталось " + money(state.unclear) + ".");
      say(null, "Записал «" + what + "» на " + money(sum) + ".");
      cashText.value = "";
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
  }
  if (cashBtn) cashBtn.onclick = submitCash;
  if (cashText) cashText.onkeydown = e => { if (e.key === "Enter") submitCash(); };
}

    <div class="t">Куда ушли деньги<span class="sp"></span><em>9 категорий</em></div>
    <div id="cats"></div>
  </div>

  <div class="sec">
    <div class="t">Что можно поправить<span class="sp"></span><em>до −${money(d.tips.reduce((s, t) => s + t.gain, 0))}</em></div>
    <div id="tips"></div>
  </div>

  <div class="sec">
    <div class="t">Ритм</div>
    <div class="strk" id="streakCard"><span class="fl icbox">${icon("flame", true)}</span>
      <span><b>${d.streak.current} дней</b> подряд · рекорд ${d.streak.record} · ${String(d.facts.actionsPerDay).replace(".", ",")} действия в день</span>
      <span class="days">${d.streak.week.map(w => '<i class="' + (w.on ? "on" : "") + '"></i>').join("")}</span></div>
  </div>

  <div class="nav">
    <button class="on"><span class="icbox">${icon("nhome", true)}</span><span class="lb">Главная</span></button>
    <button><span class="icbox">${icon("nchart", true)}</span><span class="lb">Отчёты</span></button>
    <button><span class="icbox">${icon("nask", true)}</span><span class="lb">Вопросы</span></button>
    <button><span class="icbox">${icon("ncup", true)}</span><span class="lb">Итоги</span></button>
  </div>`;

  document.getElementById("cats").innerHTML = d.categories.map(c => `
    <div class="cat"><span class="icbox">${icon(c.ic, !!c.svg)}</span>
      <span class="n">${c.n}</span><span class="pc">${c.s}%</span>
      <span class="spk"><i data-w="${Math.max(8, Math.round(c.a / maxCat * 100))}%" style="background:${c.c}"></i></span>
      <span class="v">${money(c.a)}</span></div>`).join("");
  document.getElementById("tips").innerHTML = d.tips.map(t => `
    <div class="tip"><span class="icbox">${icon(t.ic, !!t.svg)}</span>
      <div><div class="t">${t.t}</div><div class="d">${t.d}</div>
      <span class="g">экономия ${money(t.gain)}</span></div></div>`).join("");

  renderTodos(); renderQueue(); bindIntake();
  document.getElementById("masTap").onclick = tapMascot;
  requestAnimationFrame(() => {
    setAwareness(targetAwareness(), true);
    document.getElementById("fcFill").style.width = spentPct + "%";
    document.getElementById("fcMark").style.left = dayPct + "%";
    growBars(); setMascot(autoMascot());
  });
}

function renderTodos(){
  document.getElementById("gaps").innerHTML = DATA.awareness.gaps.map(g => {
    const done = state.done.indexOf(g.id) >= 0;
    return `<div class="gap ${done ? "done" : ""}"><span class="icbox">${icon(done ? "check" : g.icon, done ? true : !!g.svg)}</span>
      <span>${g.title}</span><span class="sp"></span>
      <span class="v">${done ? "разобрано" : money(g.amount)}</span></div>`; }).join("");
}
function renderQueue(){
  const q = document.getElementById("queue"); q.innerHTML = "";
  const list = DATA.disputes.filter(d => state.open.indexOf(d.id) >= 0);
  if (!list.length){
    q.appendChild(el(`<div class="alldone"><div class="icbox">${icon("check", true)}</div>
      Вопросов не осталось. Оборот понятен на ${targetAwareness()}%.</div>`));
    return;
  }
  list.forEach(d => {
    const opts = d.numeric
      ? '<div class="numrow">' + d.options.map((o, i) =>
          '<button class="ans ' + (o.sugg ? "sugg" : "") + '" data-i="' + i + '">' + o.t + "</button>").join("") + "</div>" +
        '<button class="ans wide" data-i="more">' + d.more + "</button>"
      : '<div class="ansgrid">' + d.options.map((o, i) =>
          '<button class="ans" data-i="' + i + '">' + o.t + "</button>").join("") + "</div>";
    const av = d.avKind === "icon" ? icon(d.av, false) : d.av;
    const wrap = el(`
      <div class="qwrap" data-id="${d.id}"><div class="qin"><div class="quiz pop">
        <div class="qtop"><div class="av">${av}</div>
          <div style="min-width:0"><div class="nm">${d.who}</div><div class="dt">${d.date}</div></div>
          <div class="am ${d.dir === "in" ? "in" : ""}">${d.dir === "in" ? "+" : "−"}${money(d.amount)}</div></div>
        <div class="qask"><div class="head-c">${COIN}</div><div class="q">${d.q}</div></div>
        <div class="qn">${d.note}</div>${opts}
      </div></div></div>`);
    wrap.querySelectorAll(".ans").forEach(b => { b.onclick = () => answer(d, wrap, b); });
    q.appendChild(wrap);
  });
}
function flashStreak(){
  const n = document.getElementById("streakCard");
  if (!n) return; n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
}

render();
try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
</script>
</body>
</html>
