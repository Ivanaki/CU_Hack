<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Честный месяц · виджет</title>
<!--
  Карточка виджета: то, что человек видит через секунду после тапа по
  иконке на рабочем столе. Отдельная страница, а не экран Mini App,
  потому что открывает её не Telegram, а быстрая команда: подписи
  initData здесь нет, есть короткоживущий токен в адресе.

  Один экран без прокрутки — у карточки ровно одна работа: показать
  результат тапа и, если система чего-то не понимает, дать закрыть это
  ещё одним тапом. Всё остальное живёт в Mini App.
-->
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e3e6ea;
    --ink:#10131a; --ink-2:#5b6472; --ink-3:#8b95a3;
    --accent:#0fa968; --accent-dim:#bdebd4; --warn:#c77700; --bad:#d8453c;
    --ring-track:#e6e9ee; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Переключение видимости только классом: style.display='' вернул бы
     display:none из таблицы стилей, и блок молча не появился бы. */
  .hide{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    min-height:100svh; display:flex; flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    gap:12px;
  }
  .top{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

  /* Плашка «что сейчас записали» — исчезает, если тап был просто просмотром. */
  #said{
    background:var(--accent-dim);border-color:transparent;color:#0b5f3c;
    font-weight:600;padding:12px 14px;animation:pop .35s ease-out both;
  }
  #said.bad{background:#fbe3e1;color:#8e2b24}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .hero{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:104px;height:104px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:11;stroke-linecap:round}
  .ring .track{stroke:var(--ring-track)}
  .ring .val{stroke:var(--accent);transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
  .ring b{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;letter-spacing:-.5px;
  }
  .hero .what{min-width:0}
  .hero .what .k{font-size:13px;color:var(--ink-2)}
  .hero .what .big{font-size:27px;font-weight:700;letter-spacing:-.6px;margin:2px 0 6px}
  .hero .what .sub{font-size:13px;color:var(--ink-3)}

  .rows{display:flex;gap:8px}
  /* min-width:0 — иначе длинная подпись распирает колонку и экран уезжает вбок. */
  .rows .card{flex:1 1 0;min-width:0;padding:12px 8px;text-align:center}
  .rows .n{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .rows .l{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.25}

  /* Вопрос — единственное место, где карточка что-то просит. */
  #q{border-color:var(--accent-dim);background:linear-gradient(#fff,#f7fdfa)}
  #q .tag{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);font-weight:700}
  #q .txt{margin:8px 0 4px;font-size:17px;font-weight:600;line-height:1.3}
  #q .why{font-size:13px;color:var(--ink-2);margin-bottom:12px}
  /* Короткие ответы («5 чел.») встают по двое, длинные занимают строку:
     вопрос с кнопками должен помещаться на экран целиком, иначе «один тап»
     превращается в «прокрути и тапни». */
  #q .opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  #q button{
    font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;
    border-radius:13px;padding:14px 12px;cursor:pointer;
  }
  #q button:active{transform:scale(.98)}
  #q button[disabled]{opacity:.45}

  #calm{text-align:center;color:var(--ink-2);font-size:14px;padding:18px 16px}
  #calm b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
        color:var(--ink-3);font-size:12px;gap:10px}
  .foot a{color:var(--ink-2)}
  #err{color:var(--bad);text-align:center;padding:24px 8px;font-size:15px}
  .skeleton{opacity:.35}
</style>
</head>
<body>

<div class="top"><span class="dot"></span><span id="period">Честный месяц</span></div>

<div class="card hide" id="said"></div>

<div class="card hero" id="hero">
  <div class="ring">
    <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
      <circle class="track" cx="52" cy="52" r="46"></circle>
      <circle class="val" id="arc" cx="52" cy="52" r="46"
              stroke-dasharray="289" stroke-dashoffset="289"></circle>
    </svg>
    <b id="pct">—</b>
  </div>
  <div class="what">
    <div class="k">Потрачено</div>
    <div class="big" id="spent">—</div>
    <div class="sub" id="sub">осознанность — доля оборота с понятным смыслом</div>
  </div>
</div>

<div class="rows">
  <div class="card"><div class="n" id="left">—</div><div class="l">дней до конца месяца</div></div>
  <div class="card"><div class="n" id="apd">—</div><div class="l">действий в день, по факту</div></div>
  <div class="card"><div class="n" id="oq">—</div><div class="l">спорных операций</div></div>
</div>

<div class="card hide" id="q">
  <div class="tag">Система не угадывает — спрашивает</div>
  <div class="txt" id="qtxt"></div>
  <div class="why" id="qwhy"></div>
  <div class="opts" id="qopts"></div>
</div>

<div class="card hide" id="calm">
  <b>Вопросов нет</b>
  Всё, что пришло из банка, разобрано правилами. Сегодня от вас ничего не нужно.
</div>

<div id="err" class="hide"></div>

<div class="foot">
  <span id="unclear"></span>
  <a href="/" id="full">Полный отчёт →</a>
</div>

<script>
// Токен выдан тапом по виджету и живёт полчаса. Служебного ключа на этой
// странице нет намеренно: по нему пишут данные любому пользователю, а тут
// обычный браузер, из которого адрес легко утекает в историю и скриншоты.
const PARAMS = new URLSearchParams(location.search);
const TOKEN = PARAMS.get('t') || '';
// Итог тапа приезжает в адресе: страница читает карточку заново и сама по
// себе не знает, что человек только что продиктовал.
let pendingHeadline = PARAMS.get('h') || '';
const $ = (id) => document.getElementById(id);

function show(id, on){ $(id).classList.toggle('hide', !on); }

function fail(text){
  show('err', true);
  $('err').textContent = text;
  ['hero','q','calm','said'].forEach(id => show(id, false));
  document.querySelector('.rows').classList.add('hide');
}

let shownPct = null;
function render(c){
  show('err', false);
  show('hero', true);
  document.querySelector('.rows').classList.remove('hide');
  $('period').textContent = 'Честный месяц · ' + c.period;

  const head = c.headline || pendingHeadline;
  pendingHeadline = '';
  if (head) {
    show('said', true);
    $('said').textContent = head;
    $('said').classList.toggle('bad', /^Не разобрал/.test(head));
  }

  $('spent').textContent = c.spent;
  $('left').textContent = c.days_left;
  $('apd').textContent = String(c.actions_per_day).replace('.', ',');
  $('oq').textContent = c.open_questions;
  $('sub').textContent = c.forecast || 'осознанность — доля оборота с понятным смыслом';
  $('unclear').textContent = c.unclear && c.unclear !== '0 ₽'
    ? 'не разобрано: ' + c.unclear : 'всё разобрано';

  // Кольцо и число тянутся к значению, а не появляются готовыми: после
  // ответа на вопрос видно, что процент вырос именно от этого тапа.
  const from = shownPct === null ? 0 : shownPct;
  shownPct = c.awareness;
  $('arc').style.strokeDashoffset = 289 - 289 * (c.awareness / 100);
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / 900);
    $('pct').textContent = Math.round(from + (c.awareness - from) * (1 - Math.pow(1 - k, 3))) + '%';
    if (k < 1) requestAnimationFrame(step);
  })(t0);

  const q = c.question;
  show('q', !!q);
  show('calm', !q);
  if (q) {
    $('qtxt').textContent = q.text;
    $('qwhy').textContent = [q.amount, q.explanation].filter(Boolean).join(' · ');
    $('qopts').innerHTML = '';
    q.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.label;
      b.onclick = () => answer(q.id, o.code, b);
      $('qopts').appendChild(b);
    });
  }
}

async function answer(id, code, btn){
  [...$('qopts').children].forEach(b => b.disabled = true);
  btn.textContent = '…';
  try {
    const r = await fetch('/api/v1/quick/answer?t=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({review_id: id, code})
    });
    if (!r.ok) throw new Error(await r.text());
    render(await r.json());
  } catch (e) {
    fail('Ответ не прошёл. Нажмите виджет ещё раз.');
  }
}

async function load(){
  if (!TOKEN) return fail('Карточка открывается тапом по виджету: в адресе нет токена.');
  try {
    const r = await fetch('/api/v1/quick/card?t=' + encodeURIComponent(TOKEN));
    if (r.status === 401) return fail('Ссылка больше не действует. Нажмите виджет ещё раз.');
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    fail('Сервер не отвечает.');
  }
}

load();
</script>
</body>
</html>
