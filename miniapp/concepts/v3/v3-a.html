<!DOCTYPE html>
<html lang="ru" data-variant="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Честный месяц — Аркада</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>

/* ============================================================
   ВАРИАНТ A — «АРКАДА». Прямое развитие concept-3: наклейки
   с толстым контуром, XP, задания, забег до конца месяца.
   ============================================================ */
:root{
  --bg:   #FBF0D9;
  --bg-2: #F3E4C6;
  --card: #FFFCF4;
  --card-2:#F7EEDC;
  --ink:  #1B2430;
  --hint: #8C8474;
  --stroke:#1B2430; --chip:#FBF0D9;
  --line:#E7D9BD;
  --gold:#F5B93A; --gold-d:#DFA226; --gold-soft:#FCEFD0;
  --green:#4CC86A; --green-d:#2FA854; --green-soft:#E1F6E7;
  --coral:#FF7A59; --coral-d:#E4573A; --coral-soft:#FFE8E1;
  --dot: rgba(27,36,48,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); overflow-x:hidden;
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; font-weight:700; line-height:1.35; -webkit-font-smoothing:antialiased;
}
/* глубина фона: тёплые пятна + сетка точек */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 440px at 6% -6%,  rgba(76,200,106,.20), transparent 62%),
    radial-gradient(600px 500px at 110% 16%, rgba(255,122,89,.16), transparent 60%),
    radial-gradient(560px 460px at -16% 84%, rgba(245,185,58,.20), transparent 62%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.3px);background-size:17px 17px}
.phone{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;
  padding:0 16px 12px;overflow-x:hidden}

/* --- наклейка: общий приём этого варианта --- */
.stk{border:3px solid var(--stroke);border-radius:20px;box-shadow:0 5px 0 var(--stroke)}

.bar{display:flex;align-items:center;gap:7px;padding:12px 0 12px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--stroke);
  border-radius:999px;padding:4px 11px;font-size:13px;font-weight:900;box-shadow:0 3px 0 var(--stroke)}
.pill .icbox{width:19px;height:19px}
.bar .sp{flex:1}
.tbtn{border:3px solid var(--stroke);background:var(--card);border-radius:999px;width:34px;height:34px;
  font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:0 3px 0 var(--stroke);
  flex:0 0 34px;font-weight:900;padding:0}
.tbtn:active{transform:translateY(3px);box-shadow:none}

.card{background:var(--card);border:3px solid var(--stroke);border-radius:20px;padding:15px;
  margin-bottom:14px;box-shadow:0 5px 0 var(--stroke)}
.h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.h h2{margin:0;font-size:15px;font-weight:900;letter-spacing:-.01em}
.h .sp{flex:1}
.h .tag{font-size:11px;font-weight:900;color:var(--ink);background:var(--gold-soft);
  border:2px solid var(--stroke);padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ================= ГЕРОЙ ================= */
.hero{position:relative;overflow:hidden;border-radius:26px;margin-bottom:14px;padding:13px 14px 12px;
  color:#0F2417;border:3px solid var(--stroke);box-shadow:0 6px 0 var(--stroke);
  background:radial-gradient(120% 90% at 20% 0%, #6FDC8B, transparent 62%), linear-gradient(165deg,#54CF74,#31A85A)}
.hero .tex{position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:radial-gradient(#0F2417 1.4px, transparent 1.6px);background-size:22px 22px}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:8px;margin-bottom:1px}
.hero-top .lbl{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.hero-top .lv{margin-left:auto;font-size:10.5px;font-weight:900;background:var(--chip);
  border:2px solid var(--stroke);padding:2px 9px;border-radius:999px;white-space:nowrap;color:#1B2430}
.hero-body{display:flex;align-items:center;gap:0}

.ringbox{position:relative;width:150px;height:150px;flex:0 0 150px;margin-left:-7px}
.ringbox svg{display:block}
.ringbox .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none}
.ringbox .v{font-size:49px;font-weight:900;letter-spacing:-.055em;line-height:.9;color:#FBF0D9;
  font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(15,36,23,.35)}
.ringbox .v i{font-size:20px;font-style:normal;opacity:.9}
.ringbox .c{font-size:8.8px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;
  margin-top:5px;max-width:104px;text-align:center;line-height:1.3;color:#0F2417;opacity:.82}

.mascotbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;margin-right:-4px}
.bubble{background:var(--chip);color:#1B2430;border:3px solid var(--stroke);border-radius:14px;
  padding:6px 9px;font-size:11px;font-weight:800;line-height:1.3;position:relative;text-align:center;
  width:100%;box-shadow:0 3px 0 var(--stroke);
  transform-origin:50% 120%;animation:bub-in .5s cubic-bezier(.3,1.5,.5,1) both}
.bubble:after,.bubble:before{content:"";position:absolute;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-bottom:0}
.bubble:before{bottom:-11px;border-top-color:var(--stroke)}
.bubble:after{bottom:-6px;border-width:6px;border-top-color:var(--chip)}
.bubble b{color:var(--coral-d);white-space:nowrap}
@keyframes bub-in{0%{opacity:0;transform:scale(.7) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.mas-tap{background:none;border:0;padding:0;margin:0 0 -14px;cursor:pointer;width:142px;height:142px;flex:0 0 142px}

.hero-foot{display:flex;gap:7px;margin-top:4px}
.hero-foot>div{flex:1;min-width:0;background:var(--chip);border:2.5px solid var(--stroke);
  border-radius:13px;padding:6px 8px;color:#1B2430}
.hero-foot .k{font-size:8.6px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;opacity:.55}
.hero-foot .v{font-size:12.5px;font-weight:900;margin-top:1px;white-space:nowrap}
.hero-foot .v.up{color:var(--green-d)}

/* ================= ЗАДАНИЯ ================= */
.quest{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--card-2);
  border:2.5px solid var(--stroke);margin-bottom:9px;transition:background .25s}
.quest:last-child{margin-bottom:0}
.quest.done{background:var(--green-soft)}
.quest .icbox{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#fff;
  border:2.5px solid var(--stroke);padding:4px}
.quest .t{font-size:12.5px;font-weight:800}
.quest .track{height:8px;border-radius:5px;background:var(--chip);border:2px solid var(--stroke);
  margin-top:6px;overflow:hidden}
.quest .track i{display:block;height:100%;background:var(--gold);width:0;
  transition:width 1s cubic-bezier(.2,1,.3,1)}
.quest .a{font-size:13px;font-weight:900;color:var(--coral-d);white-space:nowrap;text-align:right}
.quest .xp{font-size:10px;font-weight:900;color:var(--hint);display:block;margin-top:2px;text-align:right}

/* ================= ЗАБЕГ ДО КОНЦА МЕСЯЦА ================= */
.race{background:var(--card);border:3px solid var(--stroke);border-radius:20px;padding:15px;
  margin-bottom:14px;box-shadow:0 5px 0 var(--stroke)}
.race .big{font-size:29px;font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap;margin-top:2px}
.race .cap{font-size:11px;font-weight:800;color:var(--hint);margin-top:4px}
.lane{position:relative;height:38px;margin:14px 0 10px;border:3px solid var(--stroke);border-radius:999px;
  background:var(--chip);overflow:hidden}
.lane .fill{position:absolute;inset:0;right:auto;width:0;background:
  repeating-linear-gradient(115deg, var(--gold) 0 11px, #FFCE63 11px 22px);
  border-right:3px solid var(--stroke);transition:width 1.2s cubic-bezier(.22,1.3,.36,1)}
.lane .pin{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;
  transition:left 1.2s cubic-bezier(.22,1.3,.36,1);z-index:2}
.lane .pin .coin{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 0 rgba(27,36,48,.35))}
.lane .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;z-index:1;opacity:.85}
.race-foot{display:flex;gap:8px}
.race-foot>div{flex:1;min-width:0;border:2.5px solid var(--stroke);border-radius:13px;padding:8px 9px;background:var(--card-2)}
.race-foot .k{font-size:9.5px;font-weight:900;color:var(--hint);text-transform:uppercase;letter-spacing:.05em}
.race-foot .v{font-size:14.5px;font-weight:900;margin-top:2px;white-space:nowrap}

/* ================= СТРИК ================= */
.streak-card{position:relative;overflow:hidden;border:3px solid var(--stroke);border-radius:22px;
  padding:14px;margin-bottom:14px;color:#2A1108;box-shadow:0 5px 0 var(--stroke);
  background:linear-gradient(160deg,#FFA487 0%,#FF7A59 58%,#F2603F 100%)}
.streak-card:before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:repeating-linear-gradient(118deg, #2A1108 0 3px, transparent 3px 20px)}
.streak-card>*{position:relative;z-index:1}
.streak-top{display:flex;align-items:center;gap:11px}
.flamebox{width:44px;height:48px;flex:0 0 44px}
.streak-top .n{font-size:35px;font-weight:900;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.streak-top .t{font-size:12px;font-weight:900;opacity:.8;margin-top:1px}
.streak-top .rec{margin-left:auto;text-align:right;font-size:11px;font-weight:900;background:var(--chip);
  border:2.5px solid var(--stroke);border-radius:12px;padding:5px 9px;line-height:1.25;color:#1B2430}
.week{display:flex;gap:5px;margin-top:13px}
.week .d{flex:1;text-align:center}
.week .d .n{font-size:9.5px;font-weight:900;opacity:.72}
.week .d .b{margin-top:4px;height:29px;border:2.5px solid var(--stroke);border-radius:10px;
  background:rgba(42,17,8,.14);display:grid;place-items:center}
.week .d .b svg{width:15px;height:15px}
.week .d.on .b{background:var(--chip)}
.week .d.today .b{box-shadow:0 0 0 3px rgba(251,240,217,.65)}
.reward{margin-top:12px;background:var(--chip);border:2.5px solid var(--stroke);border-radius:13px;
  padding:7px 9px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;color:#1B2430}
.reward .icbox{width:22px;height:22px;flex:0 0 22px}
.reward .track{flex:1;height:9px;background:#EADCC0;border:2px solid var(--stroke);border-radius:6px;overflow:hidden}
.reward .track i{display:block;height:100%;background:var(--green);width:0;
  transition:width 1.1s cubic-bezier(.2,1,.3,1)}
.streak-card.flash{animation:st-flash .85s ease-out}
@keyframes st-flash{0%{transform:scale(1)}28%{transform:scale(1.025)}100%{transform:scale(1)}}
.flamebox.flash{animation:fl-pop .85s cubic-bezier(.3,1.5,.4,1)}
@keyframes fl-pop{0%{transform:scale(1)}32%{transform:scale(1.42) rotate(-6deg)}100%{transform:scale(1)}}
.flamebox .ic{animation:fl-breathe 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fl-breathe{0%,100%{transform:scaleY(1) scaleX(1)}45%{transform:scaleY(1.07) scaleX(.96)}}

/* ================= ВОПРОСЫ ================= */
.qwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.qwrap>.qin{overflow:hidden;min-height:0}
.qwrap.gone{grid-template-rows:0fr}
.quiz{border:3px solid var(--stroke);border-radius:20px;background:var(--card);padding:15px;margin-bottom:14px;
  box-shadow:0 5px 0 var(--stroke);transition:transform .42s cubic-bezier(.5,-.2,.7,.4), opacity .34s ease}
.qwrap.gone .quiz{transform:translateX(120%) rotate(7deg) scale(.94);opacity:0;pointer-events:none}
.quiz.pop{animation:q-pop .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes q-pop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
.quiz .qh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.quiz .qh .badge{background:var(--coral);color:#FBF0D9;font-size:10px;font-weight:900;padding:3px 9px;
  border:2.5px solid var(--stroke);border-radius:999px;text-transform:uppercase;letter-spacing:.07em}
.quiz .qh .cnt{margin-left:auto;font-size:11px;font-weight:800;color:var(--hint)}
.quiz .who{display:flex;align-items:center;gap:10px;background:var(--card-2);border:2.5px solid var(--stroke);
  border-radius:14px;padding:8px 10px;margin-bottom:11px}
.quiz .who .av{width:36px;height:36px;border-radius:50%;background:#fff;overflow:hidden;border:2.5px solid var(--stroke);
  display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 36px;color:#1B2430;padding:3px}
.quiz .who .nm{font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz .who .dt{font-size:10.5px;font-weight:700;color:var(--hint)}
.quiz .who .am{margin-left:auto;font-size:15px;font-weight:900;white-space:nowrap}
.quiz .who .am.in{color:var(--green-d)}
.quiz .q{font-size:15.5px;font-weight:900;line-height:1.3;margin-bottom:4px}
.quiz .qn{font-size:11.5px;font-weight:700;color:var(--hint);margin-bottom:11px;line-height:1.4}
.ans{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--stroke);
  border-radius:14px;padding:11px 12px;margin-bottom:9px;font:inherit;font-size:13.5px;font-weight:800;
  color:var(--ink);cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--stroke);
  transition:background .14s,transform .08s,box-shadow .08s}
.ans:last-child{margin-bottom:0}
.ans:hover{background:var(--gold-soft)}
.ans:active{transform:translateY(3px);box-shadow:none}
.ans.picked{background:var(--green-soft);animation:ans-pick .4s cubic-bezier(.3,1.5,.4,1)}
@keyframes ans-pick{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.ans .plus{margin-left:auto;font-size:10.5px;font-weight:900;color:var(--hint)}
.numrow{display:flex;gap:7px}
.numrow .ans{justify-content:center;font-size:18px;font-weight:900;padding:12px 0;margin-bottom:0}
.numrow .ans.sugg{background:var(--green-soft)}
.wide{margin-top:9px;justify-content:center}
.alldone{text-align:center;padding:20px 14px;background:var(--green-soft);border:3px dashed var(--green-d);
  border-radius:20px;margin-bottom:14px;font-size:13.5px;font-weight:900;line-height:1.5;
  animation:q-pop .5s cubic-bezier(.3,1.4,.5,1) both}
.alldone .icbox{width:44px;height:44px;margin:0 auto 6px;overflow:visible}

/* ================= МЕСЯЦ ================= */
.big-sum{font-size:33px;font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.sum-row{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
.sum-row .badge{font-size:11px;font-weight:900;background:var(--coral-soft);border:2px solid var(--stroke);
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.sum-row .sub{font-size:11.5px;font-weight:800;color:var(--hint);margin-left:auto;white-space:nowrap}
.need{display:flex;gap:8px;margin-top:13px}
.need>div{flex:1;min-width:0;border:2.5px solid var(--stroke);border-radius:14px;padding:9px 10px}
.need .a{background:var(--green-soft)} .need .b{background:var(--coral-soft)}
.need .k{font-size:10px;font-weight:900;color:var(--hint)}
.need .v{font-size:15.5px;font-weight:900;margin-top:3px;white-space:nowrap}

.catrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.catrow .icbox{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#fff;
  border:2.5px solid var(--stroke);padding:3px}
.catrow .n{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .n span{color:var(--hint);font-size:11px;font-weight:800}
.catrow .tr{height:9px;border-radius:5px;background:var(--chip);border:2px solid var(--stroke);
  margin-top:5px;overflow:hidden}
.catrow .tr i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.catrow .r{text-align:right;white-space:nowrap}
.catrow .v{font-size:13px;font-weight:900}
.catrow .d{font-size:10px;font-weight:800;margin-top:2px;color:var(--hint)}
.catrow .d.up{color:var(--coral-d)} .catrow .d.down{color:var(--green-d)}

.tipcard{display:flex;gap:11px;background:var(--card-2);border:2.5px solid var(--stroke);border-radius:16px;
  padding:10px;margin-bottom:9px}
.tipcard:last-child{margin-bottom:0}
.tipcard.lead{background:var(--green-soft)}
.tipcard .icbox{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:#fff;
  border:2.5px solid var(--stroke);padding:4px}
.tipcard .t{font-size:13px;font-weight:900}
.tipcard .d{font-size:11.5px;font-weight:700;color:var(--hint);margin-top:4px;line-height:1.42}
.tipcard .g{display:inline-block;margin-top:7px;background:var(--green);border:2px solid var(--stroke);
  color:#0F2417;font-size:10.5px;font-weight:900;padding:2px 9px;border-radius:999px;white-space:nowrap}

.facts{display:flex;gap:8px;text-align:center}
.facts>div{flex:1;min-width:0}
.facts .fv{font-size:19px;font-weight:900;white-space:nowrap}
.facts .fk{font-size:10px;color:var(--hint);font-weight:800;margin-top:2px}

.nav{position:sticky;bottom:8px;display:flex;gap:4px;background:var(--card);border:3px solid var(--stroke);
  border-radius:18px;padding:6px;margin-top:10px;box-shadow:0 5px 0 var(--stroke)}
.nav button{flex:1;background:none;border:0;border-radius:12px;padding:6px 0;font:inherit;font-size:9.5px;
  font-weight:900;color:var(--hint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .icbox{width:21px;height:21px;opacity:.6}
.nav button.on{background:var(--green-soft);color:var(--ink)}
.nav button.on .icbox{opacity:1}

/* ===== БЛОК «ДОБАВИТЬ ОПЕРАЦИИ» ================================= */
.intake .ways{display:flex;flex-direction:column;gap:9px}
.way{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;color:var(--ink);
  cursor:pointer;background:var(--card-2);padding:11px 12px;position:relative;
  transition:background .16s, transform .08s, box-shadow .08s}
.way .icbox{width:40px;height:40px;flex:0 0 40px;background:#fff;padding:5px}
.way .tx{flex:1;min-width:0}
.way .tx b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.way .tx i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--hint);margin-top:2px;
  line-height:1.35}
.way .go{font-size:20px;font-weight:900;color:var(--hint);flex:0 0 auto;line-height:1}
.way.cash{align-items:flex-start;cursor:default}
.cashrow{display:flex;gap:7px;margin-top:9px}
.cashrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;font-weight:700;color:var(--ink);
  background:var(--card);padding:9px 11px;outline:none;-webkit-appearance:none}
.cashrow input::placeholder{color:var(--hint);font-weight:600}
.cashrow button{font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:9px 15px;
  background:var(--green);color:#0F2417;white-space:nowrap;border:0}
.cashhint{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--hint);margin-top:8px}
.cashhint .icbox{width:15px;height:15px;background:none;padding:0;flex:0 0 15px;border:0}

.istatus{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;font-size:12.5px;
  font-weight:700;line-height:1.4;animation:ist-in .32s cubic-bezier(.3,1.3,.5,1) both}
.istatus b{font-weight:900;white-space:nowrap}

/* ---------- состояние маскота ---------- */
const mstate = { forced:null, cur:null };
function setMascot(s){
  mstate.cur = s;
  document.querySelectorAll(".mas").forEach(m => m.setAttribute("class", "mas s-" + s));
}
/* после перерисовки разметки состояние надо вернуть на место */
function reapplyMascot(){ setMascot(mstate.cur || autoMascot()); }
function autoMascot(){
  if (mstate.forced) return mstate.forced;
  if (state.unclear > 0) return "curious";
  return "proud";
}
let tapT = null;
function tapMascot(){
  haptic("light");
  document.querySelectorAll(".mas").forEach(svg => {
    svg.classList.remove("tap"); void svg.getBoundingClientRect(); svg.classList.add("tap");
  });
  clearTimeout(tapT);
  tapT = setTimeout(() => document.querySelectorAll(".mas").forEach(s => s.classList.remove("tap")), 620);
  say(state.unclear > 0 ? TAP_LINES.work : TAP_LINES.done);
}
const TAP_LINES = {
  work: ["Щекотно! Но 4 700 ₽ сами себя не объяснят.",
         "Я не коплю — я запоминаю.",
         "Один тап — и вопросов меньше."],
  done: ["Месяц честный. Можно выдохнуть.",
         "99% — почти идеально.",
         "Спроси что угодно, я всё помню."]
};
function say(lines, forced){
  const b = document.getElementById("bubble");
  if (!b) return;
  b.innerHTML = forced || lines[Math.floor(Math.random() * lines.length)];
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}

/* витрина умеет переключать состояние маскота */
window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.type !== "mascot") return;
  mstate.forced = m.state === "auto" ? null : m.state;
  setMascot(autoMascot());
});

/* ===================== ДОБАВЛЕНИЕ ОПЕРАЦИЙ =====================
   В макете загрузка имитируется: разметка, состояния и реакция экрана
   настоящие, адреса подключит бэкенд.                               */
const NEW_OPS = [
  { id:"d3", av:"О", avKind:"letter", who:"OZON", date:"19 сентября · карта", amount:2450, dir:"out",
    q:"Покупка в OZON на 2 450 ₽ — что это было?", note:"Из свежей выписки",
    options:[{t:"Товары для дома",xp:"+10 XP"},{t:"Продукты",xp:"+10 XP"},
             {t:"Подарок",xp:"+10 XP"},{t:"Другое",xp:"+10 XP"}], clears:0 },
  { id:"d4", av:"М", avKind:"letter", who:"Михаил С.", date:"19 сентября · СБП", amount:1500, dir:"in",
    q:"Пришло 1 500 ₽ от Михаил С. — что это?", note:"Из свежей выписки, назначения нет",
    options:[{t:"Вернули долг",xp:"+10 XP"},{t:"Вернули долю",xp:"+10 XP"},
             {t:"Подарок",xp:"+10 XP"},{t:"Это доход",xp:"+10 XP"}], clears:1500 }
];
let intakeBusy = false, opsAdded = false;

function istatus(kind, html){
  const box = document.getElementById("istatus");
  if (!box) return;
  if (!kind){ box.innerHTML = ""; return; }
  const ic = kind === "wait" ? '<span class="spin"></span>'
           : kind === "ok"   ? '<span class="icbox">' + icon("check", true) + "</span>"
                             : '<span class="icbox">' + icon("warn", true) + "</span>";
  box.innerHTML = '<div class="istatus ' + kind + '">' + ic + "<span>" + html + "</span></div>"
    + (kind === "wait" ? '<div class="iprog"><i id="iprog"></i></div>' : "");
  const r = box.querySelector(".retry");
  if (r) r.onclick = () => { istatus(null); document.getElementById("csvFile").click(); };
}

function fakeUpload(label, onDone){
  intakeBusy = true;
  setMascot("think");
  istatus("wait", label);
  let p = 0;
  const bar = document.getElementById("iprog");
  const t = setInterval(() => {
    p = Math.min(100, p + 9 + Math.random() * 14);
    if (bar) bar.style.width = p + "%";
    if (p >= 100){ clearInterval(t); setTimeout(() => { intakeBusy = false; onDone(); }, 240); }
  }, 110);
}

function syncUnclear(){
  document.querySelectorAll("[data-unclear]").forEach(n => { n.textContent = money(state.unclear); });
  document.querySelectorAll("[data-clear]").forEach(n => { n.textContent = money(DATA.money.turnover - state.unclear); });
  setAwareness(targetAwareness());
  if (typeof renderTodos === "function") renderTodos();
  if (typeof renderQuests === "function") renderQuests();
  if (typeof renderPath === "function") renderPath();
  growBars();
}

function addNewOps(){
  if (opsAdded) return 0;
  opsAdded = true;
  NEW_OPS.forEach(o => { DATA.disputes.push(o); state.open.push(o.id); });
  state.unclear += 1500;                       /* новое непонятное поступление */
  renderQueue();
  syncUnclear();
  return NEW_OPS.length;
}

function bindIntake(){
  const csv = document.getElementById("csvFile");
  const shot = document.getElementById("shotFile");
  const cashBtn = document.getElementById("cashBtn");
  const cashText = document.getElementById("cashText");

  if (csv) csv.onchange = () => {
    const f = csv.files && csv.files[0];
    if (!f || intakeBusy) return;
    if (!/\.csv$/i.test(f.name)){
      haptic("heavy"); setMascot("sad");
      istatus("err", 'Это не похоже на выписку — нужен файл <b>.csv</b> из интернет-банка. ' +
                     '<button class="retry" type="button">Выбрать другой</button>');
      setTimeout(() => setMascot(autoMascot()), 2400);
      csv.value = ""; return;
    }
    fakeUpload("Читаю «" + f.name + "»…", () => {
      const n = addNewOps();
      haptic("medium"); setMascot(n ? "curious" : "party");
      istatus("ok", n
        ? "Выписка разобрана: <b>128 операций</b>. Новых вопросов: <b>" + n + "</b> — уже в очереди."
        : "Выписка разобрана: <b>128 операций</b>. Новых вопросов нет.");
      say(null, n ? "Нашёл <b>" + n + " непонятные операции</b>. Глянем?" : "Всё сошлось, вопросов нет.");
    });
    csv.value = "";
  };

  if (shot) shot.onchange = () => {
    const f = shot.files && shot.files[0];
    if (!f || intakeBusy) return;
    fakeUpload("Распознаю чек…", () => {
      haptic("medium"); setMascot("party");
      istatus("ok", "С чека считал: <b>Пятёрочка</b>, <b>1 284 ₽</b>, 19 сентября. Записал в «Продукты».");
      say(null, "Чек прочитал: <b>1 284 ₽</b> в продукты.");
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
    shot.value = "";
  };

  function submitCash(){
    if (intakeBusy) return;
    const v = (cashText.value || "").trim();
    if (!v){
      haptic("heavy");
      istatus("err", "Напишите, что и на сколько. Например: <b>кофе 300</b>.");
      cashText.focus(); return;
    }
    const m = v.match(/(\d[\d\s.,]*)\s*(?:р|₽|руб\w*)?\s*$/i);
    if (!m){
      haptic("heavy"); setMascot("think");
      istatus("err", "Не вижу суммы. Напишите так: <b>кофе 300</b>.");
      setTimeout(() => setMascot(autoMascot()), 2000);
      return;
    }
    const sum = Math.round(parseFloat(m[1].replace(/\s/g, "").replace(",", ".")));
    const what = v.slice(0, m.index).trim() || "наличные";
    fakeUpload("Записываю…", () => {
      state.unclear = Math.max(0, state.unclear - Math.min(sum, state.unclear));
      syncUnclear();
      haptic("medium"); setMascot("party");
      istatus("ok", "Записал: <b>" + what + "</b> — <b>" + money(sum) + "</b>. " +
                    "Непонятного осталось " + money(state.unclear) + ".");
      say(null, "Записал «" + what + "» на " + money(sum) + ".");
      cashText.value = "";
      setTimeout(() => setMascot(autoMascot()), 2000);
    });
  }
  if (cashBtn) cashBtn.onclick = submitCash;
  if (cashText) cashText.onkeydown = e => { if (e.key === "Enter") submitCash(); };
}

      <stop offset="0" stop-color="#FBF0D9"/><stop offset="70%" stop-color="#FFE0A0"/><stop offset="100%" stop-color="#F5B93A"/>
    </linearGradient></defs>
    <g transform="rotate(-90 75 75)">
      <circle cx="75" cy="75" r="${RR}" fill="none" stroke="#1B2430" stroke-width="20" opacity=".22"/>
      <circle id="arc" cx="75" cy="75" r="${RR}" fill="none" stroke="url(#a-arc)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${RC.toFixed(1)}" stroke-dashoffset="${RC.toFixed(1)}"
        style="transition:stroke-dashoffset 1.15s cubic-bezier(.22,1.42,.36,1)"/>
    </g>

}

    <div class="hero-body">
      <div class="ringbox">${ring()}
        <div class="in"><div class="v"><span id="ringVal">0</span><i>%</i></div>
        <div class="c">оборота понятно</div></div>
      </div>
      <div class="mascotbox">
        <div class="bubble" id="bubble">Не понимаю <b id="unclearVal">${money(state.unclear)}</b>. Разберём?</div>
        <button class="mas-tap" id="masTap" aria-label="Потрогать Гроша">${MASCOT("a")}</button>
      </div>
    </div>
    <div class="hero-foot">
      <div><div class="k">Оборот</div><div class="v">${money(d.money.turnover)}</div></div>
      <div><div class="k">Понятно</div><div class="v" id="clearVal">${money(d.money.turnover - state.unclear)}</div></div>
      <div><div class="k">К августу</div><div class="v up" id="ppVal">+${d.awareness.percent - d.awareness.prev} п.п.</div></div>
    </div>
  </div>

  
  <div class="card intake sticker" id="intake">
    <div class="h"><h2>Добавить операции</h2><span class="sp"></span><span class="tag">три способа</span></div>
    <div class="ways">
      <label class="way" data-way="csv">
        <input type="file" accept=".csv,text/csv" id="csvFile" hidden>
        <span class="icbox">${icon("sheet", true)}</span>
        <span class="tx"><b>Загрузить выписку</b><i>CSV из интернет-банка — разберу все операции сразу</i></span>
        <span class="go">&rsaquo;</span>
      </label>
      <label class="way" data-way="shot">
        <input type="file" accept="image/*" capture="environment" id="shotFile" hidden>
        <span class="icbox">${icon("cam", true)}</span>
        <span class="tx"><b>Прислать скриншот или чек</b><i>Сфотографируйте чек или пришлите скрин из банка</i></span>
        <span class="go">&rsaquo;</span>
      </label>
      <div class="way cash">
        <span class="icbox">${icon("coins", true)}</span>
        <span class="tx"><b>Записать наличные</b>
          <span class="cashrow">
            <input type="text" id="cashText" inputmode="text" autocomplete="off"
                   placeholder="кофе 300" aria-label="Что и на сколько потратили">
            <button type="button" id="cashBtn">Записать</button>
          </span>
          <span class="cashhint"><span class="icbox">${icon("mic", true)}</span>
            То же самое можно надиктовать голосом в чат бота</span>
        </span>
      </div>
    </div>
    <div id="istatus"></div>
  </div>

  <div class="card">
    <div class="h"><h2>Задания до 100%</h2><span class="sp"></span><span class="tag">+50 XP за все</span></div>
    <div id="quests"></div>
  </div>

  <div class="race">
    <div class="h"><h2>Забег до конца месяца</h2><span class="sp"></span>
      <span class="tag">день ${f.days_passed} из ${f.days_total}</span></div>
    <div class="cap">Если темп не изменится, к 30 сентября будет</div>
    <div class="big">${fixed(f.projected.text)}</div>
    <div class="lane">
      <div class="fill" id="raceFill"></div>
      <div class="pin" id="racePin"><svg class="coin" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="44" cy="49" r="43" fill="#E3A526" stroke="#1B2430" stroke-width="6"/>
  <circle cx="52" cy="50" r="43" fill="#F5B93A" stroke="#1B2430" stroke-width="6"/>
  <circle cx="52" cy="50" r="34" fill="none" stroke="#E0A32A" stroke-width="4"/>
  <ellipse cx="41" cy="45" rx="8.5" ry="11" fill="#FFFDF5" stroke="#1B2430" stroke-width="4"/>
  <ellipse cx="63" cy="45" rx="8.5" ry="11" fill="#FFFDF5" stroke="#1B2430" stroke-width="4"/>
  <ellipse cx="42" cy="47" rx="5" ry="6.6" fill="#1B2430"/><ellipse cx="64" cy="47" rx="5" ry="6.6" fill="#1B2430"/>
  <circle cx="40" cy="43.5" r="2" fill="#FFFDF5"/><circle cx="62" cy="43.5" r="2" fill="#FFFDF5"/>
  <path d="M45 66 q7 7 14 0" fill="none" stroke="#1B2430" stroke-width="4.4" stroke-linecap="round"/>
</svg></div>
      <span class="flag">${icon("flag", true)}</span>
    </div>
    <div class="race-foot">
      <div><div class="k">Осталось потратить</div><div class="v">${fixed(f.remaining.text)}</div></div>
      <div><div class="k">Это по</div><div class="v">${fixed(f.daily_rate.text)}<span style="font-size:11px;color:var(--hint)"> / день</span></div></div>
    </div>
  </div>

  <div class="streak-card" id="streakCard">
    <div class="streak-top">
      <div class="flamebox icbox" id="flameBox">${icon("flame", true)}</div>
      <div><div class="n">${d.streak.current}</div><div class="t">дней подряд</div></div>
      <div class="rec">рекорд<br>${d.streak.record} дней</div>
    </div>
    <div class="week">${d.streak.week.map(w =>
      '<div class="d ' + (w.on ? "on" : "") + " " + (w.today ? "today" : "") + '"><div class="n">' + w.n +
      '</div><div class="b">' + (w.on ? icon("check", true) : "") + "</div></div>").join("")}</div>
    <div class="reward"><span class="icbox">${icon("chest", true)}</span>${d.streak.rewardName}
      <span class="track"><i id="rewardBar"></i></span>
      <span>${d.streak.current}/${d.streak.nextReward}</span></div>
  </div>

  <div id="queue"></div>

  <div class="card">
    <div class="h"><h2>Потрачено в сентябре</h2></div>
    <div class="sum-row">
      <div class="big-sum">${money(d.money.spent)}</div>
      <div class="badge">${signed(d.money.deltaPrev)} к августу</div>
      <div class="sub">получено ${money(d.money.income)}</div>
    </div>
    <div class="need">
      <div class="a"><div class="k">Так было надо</div><div class="v">${money(d.split.mandatory)}</div></div>
      <div class="b"><div class="k">Можно было не (${d.split.optionalShare}%)</div><div class="v">${money(d.split.optional)}</div></div>
    </div>
  </div>

  <div class="card">
    <div class="h"><h2>Куда ушли деньги</h2><span class="sp"></span><span class="tag">9 категорий</span></div>
    <div id="cats"></div>
  </div>

  <div class="card">
    <div class="h"><h2>Советы Гроша</h2><span class="sp"></span>
      <span class="tag">до −${money(d.tips.reduce((s, t) => s + t.gain, 0))}</span></div>
    <div id="tips"></div>
  </div>

  <div class="card">
    <div class="h"><h2>Коротко о месяце</h2></div>
    <div class="facts">
      <div><div class="fv">${String(d.facts.actionsPerDay).replace(".", ",")}</div><div class="fk">действий в день</div></div>
      <div><div class="fv">${money(d.facts.owed)}</div><div class="fk">вам должны</div></div>
      <div><div class="fv">${money(d.facts.cash)}</div><div class="fk">наличными</div></div>
    </div>
  </div>

  <div class="nav">
    <button class="on"><span class="icbox">${icon("nhome", true)}</span>Главная</button>
    <button><span class="icbox">${icon("nchart", true)}</span>Отчёты</button>
    <button><span class="icbox">${icon("nask", true)}</span>Вопросы</button>
    <button><span class="icbox">${icon("ncup", true)}</span>Награды</button>
  </div>`;

  renderQuests(); renderCats(); renderTips(); renderQueue(); bindIntake();
  document.getElementById("masTap").onclick = tapMascot;

  requestAnimationFrame(() => {
    setAwareness(targetAwareness(), true);
    document.getElementById("rewardBar").style.width =
      Math.round(DATA.streak.current / DATA.streak.nextReward * 100) + "%";
    document.getElementById("raceFill").style.width = racePct + "%";
    document.getElementById("racePin").style.left = racePct + "%";
    growBars();
    setMascot(autoMascot());
  });
}
const growBars = () => requestAnimationFrame(() =>
  document.querySelectorAll("[data-w]").forEach(i => { i.style.width = i.dataset.w; }));

function renderQuests(){
  document.getElementById("quests").innerHTML = DATA.awareness.gaps.map(g => {
    const done = state.done.indexOf(g.id) >= 0;
    return `<div class="quest ${done ? "done" : ""}">
      <div class="icbox">${icon(done ? "check" : g.icon, done ? true : !!g.svg)}</div>
      <div style="flex:1;min-width:0"><div class="t">${g.title}</div>
        <div class="track"><i data-w="${done ? 100 : g.prog}%"></i></div></div>
      <div><div class="a">${done ? "готово" : money(g.amount)}</div><span class="xp">${g.xp}</span></div>
    </div>`; }).join("");
}
function renderCats(){
  const maxCat = DATA.categories[0].a;
  document.getElementById("cats").innerHTML = DATA.categories.map(c => `
    <div class="catrow">
      <div class="icbox">${icon(c.ic, !!c.svg)}</div>
      <div style="flex:1;min-width:0"><div class="n">${c.n} <span>${c.s}%</span></div>
        <div class="tr"><i data-w="${Math.max(6, Math.round(c.a / maxCat * 100))}%" style="background:${c.c}"></i></div></div>
      <div class="r"><div class="v">${money(c.a)}</div>
        <div class="d ${c.d > 0 ? "up" : c.d < 0 ? "down" : ""}">${c.d === 0 ? "как в августе" : signed(c.d)}</div></div>
    </div>`).join("");
}
function renderTips(){
  document.getElementById("tips").innerHTML = DATA.tips.map(t => `
    <div class="tipcard ${t.lead ? "lead" : ""}"><div class="icbox">${icon(t.ic, !!t.svg)}</div>
      <div><div class="t">${t.t}</div><div class="d">${t.d}</div>
      <span class="g">экономия ${money(t.gain)}</span></div></div>`).join("");
}
function renderQueue(){
  const q = document.getElementById("queue"); q.innerHTML = "";
  const list = DATA.disputes.filter(d => state.open.indexOf(d.id) >= 0);
  if (!list.length){
    q.appendChild(el(`<div class="alldone"><div class="icbox">${icon("check", true)}</div>
      Все вопросы закрыты!<br>+45 XP и сундук стал ближе.</div>`));
    return;
  }
  list.forEach((d, idx) => {
    const opts = d.numeric
      ? '<div class="numrow">' + d.options.map((o, i) =>
          '<button class="ans ' + (o.sugg ? "sugg" : "") + '" data-i="' + i + '">' + o.t + "</button>").join("") + "</div>" +
        '<button class="ans wide" data-i="more">' + d.more + "</button>"
      : d.options.map((o, i) => '<button class="ans" data-i="' + i + '"><span>' + o.t +
          '</span><span class="plus">' + o.xp + "</span></button>").join("");
    const av = d.avKind === "icon" ? icon(d.av, false) : d.av;
    const wrap = el(`
      <div class="qwrap" data-id="${d.id}"><div class="qin"><div class="quiz pop">
        <div class="qh"><span class="badge">Вопрос ${idx + 1}</span>
          <span class="cnt">${list.length} в очереди · 1 тап</span></div>
        <div class="who"><div class="av">${av}</div>
          <div style="min-width:0"><div class="nm">${d.who}</div><div class="dt">${d.date}</div></div>
          <div class="am ${d.dir === "in" ? "in" : ""}">${d.dir === "in" ? "+" : "−"}${money(d.amount)}</div></div>
        <div class="q">${d.q}</div><div class="qn">${d.note}</div>${opts}
      </div></div></div>`);
    wrap.querySelectorAll(".ans").forEach(b => { b.onclick = () => answer(d, wrap, b); });
    q.appendChild(wrap);
  });
}

/* ===================== ОТВЕТ ===================== */
let busy = false;
function answer(d, wrap, btn){
  if (busy) return; busy = true;
  haptic("medium");
  btn.classList.add("picked");
  setMascot("party");
  flashStreak();
  setTimeout(() => {
    wrap.classList.add("gone");
    setTimeout(() => {
      state.open = state.open.filter(x => x !== d.id);
      if (d.clears) clearAmount(d.clears, "g-in");
      renderQueue(); renderQuests(); growBars();
      say(null, state.open.length
        ? "Записал! Остался ещё <b>" + state.open.length + " вопрос</b>."
        : "Красота — всё объяснили. Оборот понятен на <b>" + targetAwareness() + "%</b>.");
      busy = false;
      setTimeout(() => setMascot(autoMascot()), 1500);
    }, 460);
  }, 300);
}
function clearAmount(v, questId){
  state.unclear = Math.max(0, state.unclear - v);
  if (state.done.indexOf(questId) < 0) state.done.push(questId);
  const uv = document.getElementById("unclearVal"); if (uv) uv.textContent = money(state.unclear);
  const cv = document.getElementById("clearVal");   if (cv) cv.textContent = money(DATA.money.turnover - state.unclear);
  setAwareness(targetAwareness());
}
function setAwareness(p, first){
  state.awareness = p;
  const arc = document.getElementById("arc"), dot = document.getElementById("arcDot");
  if (arc) arc.setAttribute("stroke-dashoffset", (RC * (1 - p / 100)).toFixed(1));
  if (dot) dot.style.transform = "rotate(" + (p / 100 * 360) + "deg)";
  const node = document.getElementById("ringVal"); if (!node) return;
  const from = first ? 0 : parseInt(node.textContent, 10) || 0;
  const t0 = performance.now(), dur = first ? 1150 : 700;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    node.textContent = Math.round(from + (p - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
  const pp = document.getElementById("ppVal");
  if (pp) pp.textContent = "+" + (p - DATA.awareness.prev) + " п.п.";
}
function flashStreak(){
  [document.getElementById("streakCard"), document.getElementById("flameBox")].forEach(n => {
    if (!n) return; n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
  });
}

render();
try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
</script>
</body>
</html>
