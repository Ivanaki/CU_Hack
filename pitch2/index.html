<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Честный месяц — защита</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   «Честный месяц» — презентация для защиты.
   Дизайн-система взята один в один из miniapp/dist/index.html:
   те же токены, наклейки с толстым контуром и «толстой» тенью,
   те же плашки-теги, только светлая тема, никаких эмодзи.
   Маскот Грош — тот же инлайновый SVG и тот же движок анимаций.
   ============================================================ */

/* --- токены приложения --- */
:root{
  --bg:#FBF0D9; --bg-2:#F3E4C6; --card:#FFFCF4; --card-2:#F7EEDC;
  --ink:#1B2430; --hint:#8C8474;
  --stroke:#1B2430; --chip:#FBF0D9; --line:#E7D9BD;
  --gold:#F5B93A; --gold-d:#DFA226; --gold-soft:#FCEFD0;
  --green:#4CC86A; --green-d:#2FA854; --green-soft:#E1F6E7;
  --coral:#FF7A59; --coral-d:#E4573A; --coral-soft:#FFE8E1;
  --dot:rgba(27,36,48,.9);
  --k:1; --ko:.3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-2)}
body{
  color:var(--ink);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-weight:700;line-height:1.35;-webkit-font-smoothing:antialiased;
}

/* ================= СЦЕНА ================= */
#stage{position:fixed;inset:0}
.cell{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%) scale(var(--k));display:none}
.cell.on{display:block}

.slide{position:relative;width:1280px;height:720px;overflow:hidden;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column}
/* глубина фона: тёплые пятна + сетка точек — как в приложении */
.slide::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 4% -8%,  rgba(76,200,106,.22), transparent 62%),
    radial-gradient(900px 700px at 108% 12%, rgba(255,122,89,.17), transparent 60%),
    radial-gradient(820px 640px at -12% 108%, rgba(245,185,58,.22), transparent 62%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%)}
.slide::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.3px);background-size:17px 17px}
.slide>*{position:relative;z-index:1}

/* ================= ШАПКА И ПОДВАЛ СЛАЙДА ================= */
.top{display:flex;align-items:center;gap:10px;padding:26px 52px 0}
.top .no{font-size:13px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);background:var(--card);border:3px solid var(--stroke);
  border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--stroke)}
.top .sec{font-size:13px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--hint)}
.top .sp{flex:1}
.top .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900;
  letter-spacing:.05em;color:var(--hint)}
.top .brand .coin{width:22px;height:22px;flex:0 0 22px}

.body{flex:1;min-height:0;padding:14px 52px 0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;gap:8px;padding:0 52px 22px;margin-top:auto}
.foot .dots{display:flex;gap:6px}
.foot .dots i{width:9px;height:9px;border-radius:50%;background:var(--card);
  border:2.5px solid var(--stroke);display:block}
.foot .dots i.on{background:var(--green);width:26px;border-radius:999px}
.foot .sp{flex:1}
.foot .note{font-size:12.5px;font-weight:800;color:var(--hint)}

/* ================= ТИПОГРАФИКА ================= */
h1{margin:0;font-size:86px;font-weight:900;letter-spacing:-.045em;line-height:.94}
h2{margin:0;font-size:46px;font-weight:900;letter-spacing:-.032em;line-height:1.02}
h3{margin:0;font-size:20px;font-weight:900;letter-spacing:-.015em;line-height:1.2}
.lead{font-size:20px;font-weight:800;color:var(--hint);line-height:1.34;margin:10px 0 0}
.sub{font-size:16px;font-weight:800;color:var(--hint);line-height:1.38}
.tiny{font-size:12.5px;font-weight:800;color:var(--hint);line-height:1.4}
.hl{color:var(--coral-d)}
.hlg{color:var(--green-d)}
.num{font-variant-numeric:tabular-nums}

/* ================= НАКЛЕЙКИ ================= */
.card{background:var(--card);border:3px solid var(--stroke);border-radius:22px;
  padding:18px 20px;box-shadow:0 6px 0 var(--stroke)}
.card.soft{background:var(--card-2)}
.card.gold{background:var(--gold-soft)}
.card.green{background:var(--green-soft)}
.card.coral{background:var(--coral-soft)}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:900;
  background:var(--gold-soft);border:2.5px solid var(--stroke);padding:4px 12px;
  border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 var(--stroke)}
.tag.g{background:var(--green-soft)} .tag.c{background:var(--coral-soft)}
.tag.w{background:var(--card)}
.tags{display:flex;flex-wrap:wrap;gap:9px}

.chip{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;
  background:var(--card);border:2.5px solid var(--stroke);border-radius:13px;padding:6px 11px}
.chip b{font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* инлайновые иконки: размер задаём один раз, иначе SVG без width
   разворачивается в дефолтные 300×150 и ломает строку */
.ico{width:17px;height:17px;flex:0 0 17px;display:block}
.tag .ico{width:15px;height:15px;flex:0 0 15px}
.chip .ico{width:16px;height:16px;flex:0 0 16px}
ul.bul li .bx .ico{width:19px;height:19px;flex:0 0 19px}
.step .ico{width:21px;height:21px;flex:0 0 21px;opacity:.42}
code{font-family:inherit;font-weight:900;background:var(--card-2);
  border:2px solid var(--line);border-radius:7px;padding:0 6px;white-space:nowrap}

/* ================= СПИСКИ ================= */
ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
ul.bul li{display:flex;align-items:flex-start;gap:13px;font-size:19px;font-weight:800;line-height:1.3}
ul.bul li .bx{width:34px;height:34px;flex:0 0 34px;border:3px solid var(--stroke);border-radius:11px;
  background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 var(--stroke)}
ul.bul li .bx svg{width:19px;height:19px}
ul.bul li em{font-style:normal;display:block;font-size:14px;font-weight:800;color:var(--hint);margin-top:2px}

/* шаги пути пользователя */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--stroke);
  border-radius:18px;padding:11px 15px;box-shadow:0 5px 0 var(--stroke)}
.step .n{width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:3px solid var(--stroke);
  background:var(--gold);display:grid;place-items:center;font-size:19px;font-weight:900;color:#2A1F08}
.step.gr .n{background:var(--green)} .step.co .n{background:var(--coral)}
.step .tx{min-width:0}
.step .tx b{display:block;font-size:17.5px;font-weight:900;line-height:1.2}
.step .tx span{display:block;font-size:13.5px;font-weight:800;color:var(--hint);line-height:1.3;margin-top:1px}

/* ================= КОЛОНКИ ================= */
.cols{display:flex;gap:26px;flex:1;min-height:0}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}
.grow{flex:1}

/* ================= БОЛЬШИЕ ЧИСЛА ================= */
.stat{border:3px solid var(--stroke);border-radius:18px;padding:11px 14px;background:var(--card);
  box-shadow:0 5px 0 var(--stroke);min-width:0}
.stat .k{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.stat .v{font-size:27px;font-weight:900;letter-spacing:-.035em;line-height:1.05;margin-top:2px;
  font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;font-weight:900;letter-spacing:0}
.stat .d{font-size:12.5px;font-weight:800;color:var(--hint);line-height:1.3;margin-top:3px}
.stat.gold{background:var(--gold-soft)} .stat.green{background:var(--green-soft)}
.stat.coral{background:var(--coral-soft)} .stat.soft{background:var(--card-2)}
.statrow{display:flex;gap:12px}
.statrow>*{flex:1}

.big{font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:.96;font-variant-numeric:tabular-nums}
.big small{font-size:28px;letter-spacing:-.02em}

/* ================= ТАБЛИЦА ЭКОНОМИКИ ================= */
table.eco{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.eco{table-layout:fixed}
table.eco td,table.eco th{padding:5px 0;text-align:left;font-size:14px;font-weight:800;
  border-bottom:2px dashed var(--line);line-height:1.24}
table.eco col.a{width:46%} table.eco col.b{width:30%} table.eco col.c{width:24%}
table.eco th{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--hint);
  border-bottom:3px solid var(--stroke);padding-bottom:5px}
table.eco td.r,table.eco th.r{text-align:right;white-space:nowrap}
table.eco div.m,table.eco td.m{font-size:11.5px;font-weight:800;color:var(--hint);line-height:1.22;margin-top:1px}
table.eco tr.tot td{border-bottom:0;border-top:3px solid var(--stroke);font-size:17px;font-weight:900;
  padding-top:7px}
table.eco tr:last-child td{border-bottom:0}

/* ================= СКРИНШОТЫ ================= */
.shot{display:block;width:100%;height:auto;border-radius:16px}
.shotbox{overflow:hidden;border-radius:16px;flex:0 0 auto}
.shotbox.grow{flex:1 1 auto;min-height:0}
/* растушёвка обрезанного скриншота — на самой коробке, а не на картинке:
   картинка выше коробки, и маска по её высоте в видимую часть не попадает */
.shotbox.fade{-webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 74%,transparent 100%)}

.phone{width:252px;flex:0 0 252px;height:472px;border:9px solid var(--stroke);border-radius:36px;
  overflow:hidden;box-shadow:0 9px 0 var(--stroke);background:var(--bg);position:relative}
.phone img{width:100%;height:100%;display:block;object-fit:cover;object-position:top center}
.phone .glare{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(200deg,rgba(255,255,255,.28),transparent 34%)}
.phonecap{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:var(--hint);text-align:center;margin-top:9px}

/* ================= МАСКОТ: рамка и облачко ================= */
.masbox{display:flex;flex-direction:column;align-items:center;gap:0}
.masbox .mas{width:100%;height:100%}
.masw{width:150px;height:150px;flex:0 0 150px}
.masw.s{width:112px;height:112px;flex:0 0 112px}
.masw.l{width:230px;height:230px;flex:0 0 230px}
.masw.xl{width:290px;height:290px;flex:0 0 290px}
.bub{background:var(--chip);color:var(--ink);border:3px solid var(--stroke);border-radius:16px;
  padding:9px 13px;font-size:14.5px;font-weight:800;line-height:1.3;position:relative;text-align:center;
  box-shadow:0 4px 0 var(--stroke);max-width:290px}
.bub:before,.bub:after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  border:9px solid transparent;border-bottom:0}
.bub:before{bottom:-12px;border-top-color:var(--stroke)}
.bub:after{bottom:-7px;border-width:7px;border-top-color:var(--chip)}
.bub b{color:var(--coral-d);white-space:nowrap}
.masfloat{position:absolute;z-index:2}

/* ================= ТИТУЛ ================= */
.hero-title{flex:1;display:flex;align-items:center;gap:34px}
/* заголовок слайда и маскот в одной строке — когда в колонках места нет */
.titlerow{display:flex;align-items:flex-start;gap:20px}
.titlerow .tx{flex:1;min-width:0}
.titlerow .masbox{flex:0 0 auto;flex-direction:row;align-items:center;gap:14px}
.titlerow .bub{max-width:230px;font-size:13.5px}
.titlerow .bub:before,.titlerow .bub:after{left:auto;right:-12px;top:50%;transform:translateY(-50%);
  border:9px solid transparent;border-right:0;border-bottom-width:9px}
.titlerow .bub:before{bottom:auto;border-left-color:var(--stroke);border-top-color:transparent}
.titlerow .bub:after{bottom:auto;right:-7px;border-width:7px;border-right:0;
  border-left-color:var(--chip);border-top-color:transparent}
.wordmark{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.wordmark .coin{width:56px;height:56px;flex:0 0 56px}
.kv{display:flex;gap:12px;margin-top:22px}
.kv .stat{flex:1}

/* ================= ОБЗОР (Esc) ================= */
#stage.ov{overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
  gap:20px;padding:26px;background:var(--bg-2)}
#stage.ov .cell{position:relative;left:auto;top:auto;display:block;transform:none;
  width:calc(1280px * var(--ko));height:calc(720px * var(--ko));
  border-radius:12px;overflow:hidden;border:3px solid var(--stroke);box-shadow:0 5px 0 var(--stroke);
  cursor:pointer;background:var(--bg)}
#stage.ov .cell>.slide{transform:scale(var(--ko));transform-origin:top left}
#stage.ov .cell.on{outline:5px solid var(--green);outline-offset:-5px}

/* ================= ПОДСКАЗКА ПО КЛАВИШАМ ================= */
#help{position:fixed;right:14px;bottom:12px;z-index:60;font-size:11.5px;font-weight:900;
  letter-spacing:.04em;color:var(--hint);background:rgba(255,252,244,.86);
  border:2.5px solid var(--stroke);border-radius:999px;padding:5px 13px;
  box-shadow:0 3px 0 var(--stroke);transition:opacity .4s}
#help.hide{opacity:0}

/* ===== ДВИЖОК МАСКОТА =================================================
   Состояния задаются классом на <svg>: s-proud s-curious s-hype s-sad
   s-think s-party. Каждый «слой» группы отвечает за свою трансформацию,
   чтобы анимации не перетирали друг друга.                             */
.mas{display:block;width:100%;height:100%}
.mas .v{display:none}
.mas .mo{fill:none;stroke:#1B2430;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}

.m-lean,.m-bounce,.m-breath,.m-squash{transform-box:view-box;transform-origin:100px 176px}
.m-breath{animation:m-breath 3.6s ease-in-out infinite}
@keyframes m-breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.018)}}
.m-lean{transition:transform .55s cubic-bezier(.34,1.5,.5,1)}
.s-curious .m-lean{transform:rotate(-7deg)}
.s-think   .m-lean{transform:rotate(5deg)}
.s-sad     .m-lean{transform:translateY(8px) scale(.955)}
.s-sad     .m-breath{animation-duration:5.4s}
.s-hype  .m-bounce{animation:m-hop .58s cubic-bezier(.35,.9,.35,1) infinite}
.s-party .m-bounce{animation:m-jump .78s cubic-bezier(.25,1.1,.4,1) infinite}
.s-proud .m-bounce{animation:m-sway 4.6s ease-in-out infinite}
@keyframes m-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
@keyframes m-jump{0%,100%{transform:translateY(0) rotate(0)}28%{transform:translateY(-18px) rotate(-6deg)}
  58%{transform:translateY(-3px) rotate(5deg)}80%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes m-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}

/* реакция на тап */
.m-squash{transform-origin:100px 178px}
.mas.tap .m-squash{animation:m-tap .55s cubic-bezier(.3,1.4,.4,1)}
@keyframes m-tap{0%{transform:scale(1,1)}20%{transform:scale(1.16,.84)}46%{transform:scale(.92,1.09)}
  70%{transform:scale(1.05,.96)}100%{transform:scale(1,1)}}
.tapring{transform-box:fill-box;transform-origin:center;opacity:0}
.mas.tap .tapring{animation:m-ring .6s ease-out}
@keyframes m-ring{0%{opacity:.7;transform:scale(.55)}100%{opacity:0;transform:scale(1.45)}}

/* моргание */
.eye{transform-box:fill-box;transform-origin:center;animation:m-blink 5.6s infinite}
@keyframes m-blink{0%,92.5%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}95.6%{transform:scaleY(1)}
  97%{transform:scaleY(.06)}98.4%{transform:scaleY(1)}}
.pupils{transform-box:view-box;transition:transform .45s cubic-bezier(.34,1.4,.5,1)}
.s-curious .pupils{transform:translate(4px,-2px)}
.s-think   .pupils{transform:translate(-4.5px,-4px)}

/* мимика по состояниям */
.s-proud .e-happy,.s-party .e-happy,.s-hype .e-star,.s-sad .e-sad,
.s-curious .e-open,.s-think .e-open{display:block}
.s-proud .mo-grin,.s-party .mo-open,.s-hype .mo-open,.s-sad .mo-frown,
.s-curious .mo-wave,.s-think .mo-flat{display:block}

/* руки */
.arm{transform-box:view-box;transition:transform .5s cubic-bezier(.34,1.5,.5,1)}
.arm-l{transform-origin:50px 102px}
.arm-r{transform-origin:150px 102px}
.s-proud   .arm-l{transform:rotate(14deg)}  .s-proud   .arm-r{transform:rotate(-14deg)}
.s-hype    .arm-l{transform:rotate(46deg)}  .s-hype    .arm-r{transform:rotate(-46deg)}
.s-party   .arm-l{transform:rotate(62deg)}  .s-party   .arm-r{transform:rotate(-62deg)}
.s-sad     .arm-l{transform:rotate(-14deg)} .s-sad     .arm-r{transform:rotate(14deg)}
.s-curious .arm-l{transform:rotate(0deg)}   .s-curious .arm-r{transform:rotate(-14deg)}
.s-think   .arm-l{transform:rotate(-8deg)}
.s-curious .a-point,.s-curious .a-glass,.s-curious .a-hold,.s-think .a-chin{display:block}
.s-curious .a-idle-r,.s-think .a-idle-r,.s-curious .a-idle-l{display:none}
.s-think .arm-r{display:none}

/* реквизит */
.s-hype .p-flame,.s-hype .p-spark,.s-sad .p-tear,.s-party .p-conf,
.s-curious .p-ask,.s-think .p-dots,.s-proud .p-spark{display:block}
.p-flame .fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl-flick 1.1s ease-in-out infinite}
@keyframes fl-flick{0%,100%{transform:scaleY(1) scaleX(1)}35%{transform:scaleY(1.1) scaleX(.94)}
  65%{transform:scaleY(.94) scaleX(1.05)}}
.spark{transform-box:fill-box;transform-origin:center;animation:sp-twinkle 2.2s ease-in-out infinite}
.p-spark g:nth-of-type(2) .spark{animation-delay:.6s}
.p-spark g:nth-of-type(3) .spark{animation-delay:1.2s}
@keyframes sp-twinkle{0%,100%{transform:scale(.15) rotate(0);opacity:0}
  40%{transform:scale(1) rotate(40deg);opacity:1}70%{transform:scale(.55) rotate(70deg);opacity:.45}}
.tear{transform-box:fill-box;transform-origin:center;animation:tr-drop 2.8s ease-in infinite}
@keyframes tr-drop{0%{transform:translateY(0) scale(.25);opacity:0}16%{transform:translateY(0) scale(1);opacity:1}
  70%{transform:translateY(28px) scale(.95);opacity:.9}86%,100%{transform:translateY(36px) scale(.2);opacity:0}}
.conf{transform-box:fill-box;transform-origin:center;animation:cf-fall 1.6s linear infinite}
.p-conf .conf:nth-of-type(2){animation-delay:.22s}.p-conf .conf:nth-of-type(3){animation-delay:.45s}
.p-conf .conf:nth-of-type(4){animation-delay:.68s}.p-conf .conf:nth-of-type(5){animation-delay:.9s}
.p-conf .conf:nth-of-type(6){animation-delay:1.1s}.p-conf .conf:nth-of-type(7){animation-delay:1.3s}
@keyframes cf-fall{0%{transform:translateY(-8px) rotate(0);opacity:0}12%{opacity:1}
  100%{transform:translateY(78px) rotate(320deg);opacity:0}}
.qm{transform-box:fill-box;transform-origin:50% 100%;animation:qm-bob 1.8s ease-in-out infinite}
@keyframes qm-bob{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-6px) rotate(7deg)}}
.p-dots circle{animation:dt 1.5s ease-in-out infinite}
.p-dots circle:nth-child(2){animation-delay:.22s}.p-dots circle:nth-child(3){animation-delay:.44s}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.m-shadow{transition:opacity .4s}

@page{size:13.333in 7.5in;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #help{display:none!important}
  #stage,#stage.ov{position:static;display:block;overflow:visible;padding:0;gap:0;background:#fff}
  .cell,#stage.ov .cell{display:block!important;position:static;left:auto;top:auto;
    width:1280px;height:720px;transform:none;border:0;border-radius:0;box-shadow:none;outline:0;
    overflow:hidden;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .cell:last-child{break-after:auto;page-break-after:auto}
  #stage.ov .cell>.slide{transform:none}
  /* анимации замораживаем: в PDF кадр «на полпути» выглядит как брак */
  *,*::before,*::after{animation:none!important;transition:none!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>

function head(i) {
  if (i === 0) return '';
  return `<div class="top">
    <span class="no">Слайд ${i}</span>
    <span class="sec">${SEC[i]}</span>
    <span class="sp"></span>
    <span class="brand">${COIN()} ЧЕСТНЫЙ МЕСЯЦ</span>

}
function foot(i, note) {
  let d = '';
  for (let n = 0; n < 8; n++) d += `<i class="${n === i ? 'on' : ''}"></i>`;
  return `<div class="foot"><div class="dots">${d}</div><span class="sp"></span>

}

/* ============================================================
   Сборка, навигация, масштаб.
   ============================================================ */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.map((html, i) => `<div class="cell" data-i="${i}">${html}</div>`).join('');

// маскоты подставляем после сборки: data-mas="uid:state"
document.querySelectorAll('[data-mas]').forEach((n) => {
  const [uid, state] = n.getAttribute('data-mas').split(':');
  n.innerHTML = MASCOT(uid, state);
});

const cells = [...document.querySelectorAll('.cell')];
let cur = 0, ov = false;

function show(i) {
  cur = Math.max(0, Math.min(cells.length - 1, i));
  cells.forEach((c, n) => c.classList.toggle('on', n === cur));
  if (ov) cells[cur].scrollIntoView({block: 'nearest'});
  location.hash = cur ? '#' + (cur + 1) : '';
}
function fit() {
  const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.documentElement.style.setProperty('--k', k);
  // обзор: три колонки, но не уже разумного и не шире окна
  const pad = 26 * 2, gap = 20 * 2;
  const ko = Math.min(.42, Math.max(.16, (window.innerWidth - pad - gap) / 3 / 1280));
  document.documentElement.style.setProperty('--ko', ko);
}
function overview(on) {
  ov = on;
  stage.classList.toggle('ov', on);
  cells.forEach((c) => c.classList.toggle('on', ov ? false : false));
  if (ov) { cells.forEach((c, n) => c.classList.toggle('on', n === cur)); cells[cur].scrollIntoView({block: 'center'}); }
  else show(cur);
}
cells.forEach((c) => c.addEventListener('click', () => { if (ov) { cur = +c.dataset.i; overview(false); } }));

addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown') { e.preventDefault(); if (ov) overview(false); else show(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); if (ov) overview(false); else show(cur - 1); }
  else if (k === 'Home') { e.preventDefault(); show(0); }
  else if (k === 'End') { e.preventDefault(); show(cells.length - 1); }
  else if (k === 'Escape') { e.preventDefault(); overview(!ov); }
  else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') {
    e.preventDefault();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});
addEventListener('resize', fit);
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n) show(n - 1); });

fit();
show(parseInt(location.hash.slice(1), 10) - 1 || 0);
setTimeout(() => document.getElementById('help').classList.add('hide'), 6000);
addEventListener('mousemove', () => {
  const h = document.getElementById('help');
  h.classList.remove('hide');
  clearTimeout(h._t); h._t = setTimeout(() => h.classList.add('hide'), 3000);
});
</script>
